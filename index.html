<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#123047">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<link rel="manifest" href="manifest.webmanifest">
<title>Gym Tracker</title>
<style>
:root{
  --bg:#F3F7F9;
  --surface:#FFFFFF;
  --surface2:#EEF4F6;
  --surface3:#DDECEF;
  --text:#123047;
  --muted:#5F7A8A;
  --line:#CFE0E6;
  --primary:#20B8B0;
  --primary-dark:#123047;
  --good:#2BAE72;
  --warn:#E89B3C;
  --danger:#D55454;
  --shadow:0 10px 30px rgba(18,48,71,.10);
}
body.dark{
  --bg:#081820;
  --surface:#102530;
  --surface2:#123047;
  --surface3:#123047;
  --text:#EAF7FA;
  --muted:#9DB8C5;
  --line:#234757;
  --primary:#20B8B0;
  --primary-dark:#EAF7FA;
  --good:#31C07C;
  --warn:#F2AA49;
  --danger:#F06A6A;
  --shadow:0 12px 34px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:860px;margin:auto;min-height:100vh;padding-bottom:calc(98px + env(safe-area-inset-bottom))}
header{
  position:sticky;top:0;z-index:30;
  padding:calc(13px + env(safe-area-inset-top)) 12px 10px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(16px);border-bottom:1px solid color-mix(in srgb,var(--line) 75%,transparent)
}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:43px;height:43px;border-radius:13px;box-shadow:0 7px 18px rgba(6,75,120,.22)}
h1{font-size:20px;line-height:1;margin:0;letter-spacing:-.025em}
.subtitle{margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.3}
.top-actions{display:flex;gap:7px;align-items:center}
.iconbtn{
  width:43px;height:43px;border:1px solid var(--line);border-radius:13px;background:var(--surface);
  color:var(--text);font-weight:900;box-shadow:0 5px 15px rgba(20,70,105,.06)
}
#cloudStatus{margin:7px 3px 0;font-size:10px;color:var(--muted);font-weight:800}
.cloud-ok{color:var(--good)!important}.cloud-sync{color:var(--primary)!important}.cloud-error{color:var(--bad)!important}
main{padding:12px}
.screen{display:none}.screen.active{display:block}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:20px;
  box-shadow:var(--shadow);padding:14px;margin-bottom:11px
}
.day-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.day-head h2{margin:0;font-size:21px;letter-spacing:-.035em}
.day-head p{margin:4px 0 0;color:var(--muted);font-size:12px}
.meta{display:grid;gap:8px;margin-top:12px}.meta.monday{grid-template-columns:1fr 1fr 1fr}.meta.single{grid-template-columns:1fr}
label span{display:block;margin:0 0 5px;color:var(--muted);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.045em}
input,select,textarea{
  width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface2);
  color:var(--text);padding:11px;outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(11,106,168,.12)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.primary,.secondary,.danger,.warn,.smallbtn{
  border:0;border-radius:12px;padding:11px 13px;font-weight:900
}
.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 8px 20px rgba(11,106,168,.22)}
.secondary{background:var(--surface3);color:var(--primary-dark)}
.danger{background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad)}
.warn{background:color-mix(in srgb,var(--warn) 13%,var(--surface));color:var(--warn)}
.smallbtn{padding:8px 10px;background:var(--surface3);color:var(--primary-dark);font-size:11px}
.full{width:100%}
.recommend{
  border:1px solid color-mix(in srgb,var(--primary) 32%,var(--line));
  background:linear-gradient(145deg,color-mix(in srgb,var(--surface3) 75%,var(--surface)),var(--surface));
  position:relative;overflow:hidden
}
.recommend:after{content:"";position:absolute;right:-35px;top:-45px;width:120px;height:120px;border-radius:50%;background:rgba(85,185,236,.14)}
.recommend-label{font-size:9px;font-weight:950;letter-spacing:.09em;color:var(--primary);text-transform:uppercase}
.recommend h3{margin:5px 0 4px;font-size:18px}.recommend p{margin:0;color:var(--muted);font-size:11px;line-height:1.45;max-width:650px}
.day-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.exercise{
  display:block;background:var(--surface);border:1px solid var(--line);border-radius:17px;
  margin:7px 0;overflow:hidden;box-shadow:0 5px 18px rgba(20,70,105,.055)
}
.exercise[open]{border-color:color-mix(in srgb,var(--primary) 35%,var(--line));box-shadow:0 10px 26px rgba(20,70,105,.11)}
.exercise-summary{
  list-style:none;display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;
  -webkit-tap-highlight-color:transparent
}
.exercise-summary::-webkit-details-marker{display:none}.exercise-summary::marker{display:none}
.donebox{width:22px;height:22px;flex:none;accent-color:var(--good)}
.exercise-main{min-width:0;flex:1}
.exercise-name{font-size:15px;font-weight:950;line-height:1.15}
.exercise-target{margin-top:4px;color:var(--primary);font-size:11px;font-weight:850}
.exercise-last{margin-top:3px;color:var(--muted);font-size:10px}
.replacement-note{display:inline-block;margin-top:4px;color:var(--warn);font-size:9px;font-weight:900}
.chevron{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:.18s}
.exercise[open] .chevron{transform:rotate(225deg);margin-top:6px}
.exercise-body{padding:11px;border-top:1px solid var(--line);background:var(--surface2)}
.sets{display:grid;gap:8px}
.setrow{
  padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);
}
.sethead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;font-size:11px;font-weight:950}
.inputs{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.inputs.one{grid-template-columns:1fr}.inputs.three{grid-template-columns:repeat(3,1fr)}
.inputs input{text-align:center;padding:10px}
.exercise-buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.note{margin-top:9px}
.tip{margin-top:9px;padding:9px 10px;border-radius:12px;background:var(--surface3);font-size:10px;line-height:1.45;color:var(--muted)}
.extra-badge{font-size:8px;padding:4px 6px;border-radius:999px;background:var(--surface3);color:var(--primary);font-weight:950}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:35;
  padding:7px 10px calc(7px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--surface) 94%,transparent);border-top:1px solid var(--line);backdrop-filter:blur(16px)
}
.navinner{max-width:860px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.navbtn{border:0;border-radius:13px;background:transparent;color:var(--muted);padding:8px 4px;font-size:10px;font-weight:900}
.navbtn span{display:block;font-size:19px;margin-bottom:2px}.navbtn.active{background:var(--surface3);color:var(--primary)}
dialog{border:0;padding:0;background:transparent;max-width:none}
dialog::backdrop{background:rgba(2,17,28,.66);backdrop-filter:blur(4px)}
.modal{
  width:min(640px,calc(100vw - 20px));max-height:calc(100vh - 28px);overflow:auto;
  background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:23px;
  padding:17px;box-shadow:0 24px 80px rgba(0,0,0,.35);position:relative
}
.modal.wide{width:min(760px,calc(100vw - 16px))}
.close{position:sticky;float:right;top:0;z-index:2}
.library-search{margin-top:10px}
.category-chips{display:flex;gap:7px;overflow:auto;padding:10px 0 7px}
.chip{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:var(--surface2);color:var(--muted);padding:8px 10px;font-size:10px;font-weight:900}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.library-group h4{margin:16px 0 7px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.library-item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);margin:7px 0}
.library-item-main{min-width:0;flex:1}.library-item-name{font-size:13px;font-weight:950}.library-item-meta{margin-top:3px;color:var(--muted);font-size:9px}
.library-recommend{padding:12px;border:1px solid color-mix(in srgb,var(--primary) 35%,var(--line));border-radius:16px;background:var(--surface3);margin:10px 0}
.library-recommend h4{margin:3px 0 4px}.library-recommend p{margin:0;color:var(--muted);font-size:10px;line-height:1.4}
.history-card{padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);margin:8px 0}
.history-card strong{font-size:12px}.history-card p{margin:5px 0 0;color:var(--muted);font-size:10px;line-height:1.45}
.empty{text-align:center;padding:24px;color:var(--muted);font-size:12px}
.progress-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px;border:1px solid var(--line);border-radius:15px;background:var(--surface2)}.stat span{display:block;color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase}.stat strong{display:block;margin-top:5px;font-size:18px}
canvas{width:100%;height:180px;border:1px solid var(--line);border-radius:15px;background:var(--surface2)}
.workout-running{
  display:none;position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  z-index:55;width:min(520px,calc(100% - 18px));align-items:center;gap:8px;padding:8px;
  border:1px solid rgba(255,255,255,.26);border-radius:16px;background:rgba(6,75,120,.94);color:#fff;box-shadow:0 12px 36px rgba(0,0,0,.27)
}
.workout-running.show{display:flex}.workout-running strong{font-variant-numeric:tabular-nums;margin-left:auto}
.live-overlay,.rest-overlay{
  display:none;position:fixed;inset:0;z-index:70;overflow:auto;
  background:radial-gradient(circle at 75% 0%,rgba(98,205,255,.25),transparent 32%),linear-gradient(180deg,#075f96 0,#0a3a5b 28%,#071b29 100%)
}
.live-overlay.show,.rest-overlay.show{display:block}
.live-shell{width:min(760px,100%);min-height:100%;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(105px + env(safe-area-inset-bottom));color:#fff}
.live-top{display:grid;grid-template-columns:48px 1fr auto;gap:9px;align-items:center}
.live-top button{min-height:46px;border:1px solid rgba(255,255,255,.23);border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-weight:900}
.live-clock{text-align:center}.live-clock span{display:block;font-size:9px;letter-spacing:.12em;font-weight:900;opacity:.72}.live-clock strong{display:block;font-size:27px;font-variant-numeric:tabular-nums}
.live-progress{height:6px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:13px}.live-progress div{height:100%;background:#fff;border-radius:inherit}
.live-progress-text{text-align:center;font-size:10px;font-weight:850;opacity:.72;margin-top:6px}
.live-card{margin-top:13px;padding:16px;border-radius:23px;background:#fff;color:#102a43;box-shadow:0 24px 70px rgba(0,0,0,.32)}
.live-card h2{font-size:25px;line-height:1.08;margin:5px 0 4px;letter-spacing:-.035em}.kicker{color:#6d8190;font-size:9px;font-weight:950;text-transform:uppercase;letter-spacing:.08em}
.live-target{color:#0b6aa8;font-size:12px;font-weight:900}.live-last{margin-top:6px;color:#6d8190;font-size:10px}
.video-btn{width:100%;margin-top:13px;border:0;border-radius:14px;padding:13px;background:#e4f5ff;color:#075f96;font-weight:950}
.live-set{margin-top:13px;padding:13px;border:1px solid #d6e7f1;border-radius:17px;background:#f7fbff}.live-set h3{margin:0 0 9px;font-size:16px}
.live-inputs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.live-inputs.one{grid-template-columns:1fr}.live-inputs.three{grid-template-columns:repeat(3,1fr)}
.live-inputs input{min-height:52px;background:#fff;font-size:17px;font-weight:850;text-align:center}
.live-done{width:100%;min-height:52px;margin-top:10px;border:0;border-radius:14px;background:linear-gradient(135deg,#0b6aa8,#55b9ec);color:#fff;font-weight:950}
.live-card details{margin-top:11px;border:1px solid #d6e7f1;border-radius:14px;overflow:hidden}.live-card details summary{list-style:none;padding:11px;color:#5e7484;font-size:11px;font-weight:900}.live-card details summary::-webkit-details-marker{display:none}.live-tech{padding:0 11px 11px;color:#5e7484;font-size:10px;line-height:1.45}.live-tech ul{padding-left:17px}
.live-nav{position:fixed;left:50%;bottom:calc(9px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(736px,calc(100% - 24px));display:grid;grid-template-columns:1fr 1fr;gap:8px}
.live-nav button{min-height:49px;border:1px solid rgba(255,255,255,.23);border-radius:14px;background:rgba(255,255,255,.13);color:#fff;font-weight:950}.live-nav button:last-child{background:#fff;color:#075f96}
.rest-shell{min-height:100%;display:flex;align-items:center;justify-content:center;padding:calc(18px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));color:#fff;text-align:center}
.rest-panel{width:min(520px,100%)}.rest-panel .kicker{color:rgba(255,255,255,.72)}.rest-time{font-size:76px;font-weight:950;font-variant-numeric:tabular-nums;margin:18px 0}.rest-panel h2{margin:0;font-size:22px}.rest-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.rest-actions button{min-height:52px;border:1px solid rgba(255,255,255,.24);border-radius:15px;background:rgba(255,255,255,.14);color:#fff;font-weight:950}.rest-actions button:last-child{background:#fff;color:#075f96}
@media(max-width:560px){
  .meta.monday,.progress-grid,.stat-grid{grid-template-columns:1fr}
  .day-tools{grid-template-columns:1fr 1fr}
  .inputs.three,.live-inputs.three{grid-template-columns:1fr}
  .modal{padding:14px}
  .live-card{padding:14px}
}

/* v19 database and compact five-button navigation */
.navinner{grid-template-columns:repeat(5,1fr)}
.navbtn{min-width:0;padding-left:3px;padding-right:3px}
.navbtn b{font-size:9px}
.database-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.database-grid{display:grid;gap:9px}
.database-item{
  display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  padding:12px;border:1px solid var(--line);border-radius:15px;background:var(--surface2)
}
.database-item h4{margin:0;font-size:14px}
.database-item p{margin:4px 0 0;color:var(--muted);font-size:10px}
.database-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.custom-badge{display:inline-block;margin-left:5px;padding:3px 6px;border-radius:999px;background:var(--surface3);color:var(--primary-dark);font-size:8px;font-weight:900}
.custom-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.custom-form-grid .full-row{grid-column:1/-1}
.prefill-note{font-size:9px;color:var(--good);font-weight:850;margin-top:4px}
@media(max-width:560px){
  .custom-form-grid{grid-template-columns:1fr}
  .custom-form-grid .full-row{grid-column:auto}
  .database-item{grid-template-columns:1fr}
  .database-actions{justify-content:flex-start}
  .navbtn span{font-size:17px}
}


/* v20: simpler visual system */
.navinner{grid-template-columns:repeat(4,1fr)}
.navbtn{padding:8px 5px}
.navbtn b{font-size:10px}
.day-switch{
  display:grid;grid-template-columns:repeat(3,1fr);gap:7px;
  padding:5px;background:var(--surface3);border-radius:15px;margin-bottom:12px
}
.day-switch button{
  border:0;border-radius:11px;padding:10px 6px;background:transparent;color:var(--muted);font-weight:900
}
.day-switch button.active{background:var(--surface);color:var(--primary-dark);box-shadow:0 5px 14px rgba(20,70,105,.10)}
.today-intro{margin-bottom:10px}
.resume-card{
  border:1px solid color-mix(in srgb,var(--primary) 42%,var(--line));
  background:linear-gradient(135deg,var(--surface),var(--surface3));
}
.resume-line{display:flex;justify-content:space-between;gap:10px;align-items:center}
.exercise-status{
  width:23px;height:23px;border-radius:50%;border:2px solid var(--line);
  display:grid;place-items:center;font-size:12px;font-weight:950;flex:none
}
.exercise-status.current{border-color:var(--primary);background:var(--surface3);color:var(--primary-dark)}
.exercise-status.done{border-color:var(--good);background:var(--good);color:#fff}
.exercise-status.later{border-color:var(--warn);color:var(--warn)}
.quick-stepper{display:grid;grid-template-columns:46px 1fr 46px;gap:7px;align-items:center}
.quick-stepper button{
  min-height:50px;border:1px solid var(--line);border-radius:13px;background:var(--surface3);
  color:var(--primary-dark);font-size:17px;font-weight:950
}
.quick-stepper input{width:100%}
.set-kind{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;background:var(--surface3);
  border-radius:12px;margin-bottom:9px
}
.set-kind button{
  border:0;border-radius:9px;padding:8px;background:transparent;color:var(--muted);font-weight:900;font-size:11px
}
.set-kind button.active{background:var(--surface);color:var(--primary-dark);box-shadow:0 3px 10px rgba(20,70,105,.10)}
.toast{
  position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  z-index:120;display:none;align-items:center;gap:12px;padding:12px 14px;border-radius:15px;
  background:#102a43;color:#fff;box-shadow:0 14px 35px rgba(0,0,0,.28);font-size:12px;font-weight:850
}
.toast.show{display:flex;animation:toastIn .2s ease forwards}
.toast button{border:0;border-radius:9px;padding:7px 9px;background:#fff;color:#102a43;font-weight:900}
@keyframes toastIn{to{transform:translateX(-50%) translateY(0)}}
.history-list{display:grid;gap:9px}
.history-row{
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  padding:12px;border:1px solid var(--line);border-radius:15px;background:var(--surface2)
}
.history-date{font-size:11px;font-weight:900;color:var(--primary-dark)}
.history-row h4{margin:0;font-size:14px}.history-row p{margin:4px 0 0;color:var(--muted);font-size:10px}
.more-grid{display:grid;gap:9px}
.more-action{
  width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:14px;border:1px solid var(--line);border-radius:15px;background:var(--surface2);
  color:var(--text);font-weight:900;text-align:left
}
.more-action span:last-child{color:var(--muted)}
.live-input-block{display:grid;gap:7px}
.live-input-label{text-align:center;font-size:10px;color:var(--muted);font-weight:850}
@media(max-width:460px){
  .navbtn span{font-size:18px}
  .resume-line{align-items:flex-start;flex-direction:column}
}


/* v23: clear colour identity for workout days */
.day-switch{
  background:color-mix(in srgb,var(--surface3) 82%,transparent);
  border:1px solid var(--line);
}
.day-switch button{
  display:flex;align-items:center;justify-content:center;gap:7px;
  min-height:44px;transition:transform .15s ease,box-shadow .15s ease,background .15s ease
}
.day-switch button:active{transform:scale(.98)}
.day-dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.9}
.day-switch .day-monday{color:#1476b8}
.day-switch .day-wednesday{color:#7257c7}
.day-switch .day-friday{color:#d26b2f}
.day-switch .day-monday.active{
  color:#0b5f9b;background:linear-gradient(135deg,#e3f4ff,#f7fcff);
  box-shadow:inset 0 0 0 1px rgba(20,118,184,.20),0 5px 14px rgba(20,118,184,.11)
}
.day-switch .day-wednesday.active{
  color:#6546ba;background:linear-gradient(135deg,#f0ebff,#fbf9ff);
  box-shadow:inset 0 0 0 1px rgba(114,87,199,.20),0 5px 14px rgba(114,87,199,.11)
}
.day-switch .day-friday.active{
  color:#b95420;background:linear-gradient(135deg,#fff0e7,#fffaf6);
  box-shadow:inset 0 0 0 1px rgba(210,107,47,.20),0 5px 14px rgba(210,107,47,.11)
}
.calendar-day-note{

  grid-template-columns:44px 1fr 42px;
  gap:11px;
  align-items:center;
  padding:14px;
  border:1px solid rgba(32,184,176,.30);
  border-radius:20px;
  background:rgba(32,184,176,.07);
}
.recommendation-star{
  display:grid;
  place-items:center;
  width:44px;
  height:44px;
  border-radius:14px;
  background:var(--modern-teal);
  color:#fff;
  font-size:21px;
}
.modern-recommendation h3{margin:3px 0;font-size:15px}
.modern-recommendation p{margin:0;color:var(--muted);font-size:10px}
.modern-recommendation button{
  width:42px;
  height:42px;
  border:0;
  border-radius:13px;
  background:var(--modern-navy);
  color:#fff;
  font-size:20px;
}

/* LIVE */
.live-overlay{
  background:
    radial-gradient(circle at 85% 0%,rgba(32,184,176,.20),transparent 30%),
    linear-gradient(180deg,#0A2739 0%,#071923 100%)!important;
}
.live-shell{
  max-width:680px;
  padding:calc(12px + env(safe-area-inset-top)) 12px calc(138px + env(safe-area-inset-bottom));
}
.live-top{
  grid-template-columns:48px 1fr auto;
}
.live-top button{
  border-radius:16px;
  background:rgba(255,255,255,.09);
}
.live-progress{
  height:5px;
  background:rgba(255,255,255,.10);
}
.live-progress div{
  background:linear-gradient(90deg,#20B8B0,#78E1DB);
}
.live-card{
  margin-top:13px;
  padding:14px;
  border-radius:26px;
  background:#F8FBFC;
  box-shadow:0 24px 70px rgba(0,0,0,.32);
}
.modern-live-hero{
  display:grid;
  grid-template-columns:58px 1fr auto;
  gap:12px;
  align-items:center;
}
.modern-live-glyph{
  display:grid;
  place-items:center;
  width:58px;
  height:58px;
  border-radius:18px;
  background:linear-gradient(145deg,#E8F7F6,#D9EEEE);
  color:#0B8E88;
  font-size:28px;
}
.modern-live-title span{
  display:block;
  color:#6D8190;
  font-size:8px;
  font-weight:950;
  letter-spacing:.1em;
  text-transform:uppercase;
}
.modern-live-title h2{
  margin:3px 0;
  font-size:22px;
}
.modern-live-title p{
  margin:0;
  color:#0B8E88;
  font-size:11px;
  font-weight:900;
}
.modern-video-btn{
  width:auto;
  min-width:72px;
  min-height:39px;
  padding:7px 10px;
  border:1px solid #BFE4E2;
  border-radius:12px;
  background:#EEF9F8;
  color:#0B8E88;
  font-size:11px;
}
.modern-previous{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:11px;
  padding:9px 11px;
  border-radius:13px;
  background:#EEF3F6;
  color:#607787;
  font-size:10px;
}
.live-round-metrics{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}
.live-round-metrics div{
  display:grid;
  place-items:center;
  min-height:82px;
  padding:8px;
  border:5px solid #D8EEEE;
  border-radius:50%;
  text-align:center;
}
.live-round-metrics div:nth-child(2){border-color:#BFE3E1}
.live-round-metrics div:nth-child(3){border-color:#F2D29D}
.live-round-metrics strong{
  display:block;
  color:#173E58;
  font-size:17px;
}
.live-round-metrics span{
  display:block;
  color:#708594;
  font-size:8px;
  font-weight:900;
  text-transform:uppercase;
}
.modern-live-set{
  margin-top:13px;
  padding:13px;
  border:1px solid #D8E6EC;
  border-radius:20px;
  background:#F1F6F8;
}
.modern-set-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}
.modern-set-heading span{
  color:#0B8E88;
  font-size:9px;
  font-weight:950;
  text-transform:uppercase;
}
.modern-set-heading h3{
  margin:2px 0 0;
  color:#173E58;
  font-size:16px;
}
.set-progress-pill{
  display:grid;
  place-items:center;
  min-width:44px;
  height:34px;
  padding:0 9px;
  border-radius:999px;
  background:#173E58;
  color:#fff!important;
}
.modern-live-inputs{
  gap:9px;
}
.modern-live-inputs .live-input-block{
  padding:11px;
  border:1px solid #D9E7ED;
  border-radius:18px;
  background:#fff;
}
.modern-live-inputs .live-input-label{
  color:#6C8492;
  font-size:9px;
  text-align:center;
}
.modern-live-inputs .quick-stepper{
  grid-template-columns:44px minmax(0,1fr) 44px;
}
.modern-live-inputs .quick-stepper button{
  min-height:54px;
  border-radius:14px;
  background:#EAF5F5;
  color:#0B8E88;
  font-size:25px;
}
.modern-live-inputs input{
  min-width:0;
  min-height:64px;
  border:0;
  background:#fff;
  color:#102F46;
  font-size:30px;
  text-align:center;
}
.modern-live-inputs .weight-step-row{
  margin-top:5px;
}
.modern-complete-set{
  min-height:56px;
  margin-top:10px;
  border-radius:16px;
  background:linear-gradient(135deg,#20B8B0,#0FA29B);
  font-size:15px;
}
.modern-saved-sets{
  margin-top:13px;
  padding:13px;
  border-radius:19px;
  background:#F1F6F8;
}
.modern-saved-sets .saved-sets-title{
  display:flex;
  justify-content:space-between;
}
.modern-saved-sets .saved-sets-title small{
  display:grid;
  place-items:center;
  min-width:25px;
  height:25px;
  border-radius:999px;
  background:#173E58;
  color:#fff;
}
.completed-set-table{
  overflow:hidden;
  margin-top:8px;
  border:1px solid #D9E7ED;
  border-radius:14px;
  background:#fff;
}
.modern-saved-sets .saved-set-row{
  display:grid;
  grid-template-columns:28px 1fr auto;
  border:0;
  border-bottom:1px solid #E2ECF0;
  border-radius:0;
  background:#fff;
}
.modern-saved-sets .saved-set-row:last-child{border-bottom:0}
.saved-set-number{
  display:grid;
  place-items:center;
  width:25px;
  height:25px;
  border-radius:8px;
  background:#EAF5F5;
  color:#0B8E88;
  font-weight:950;
}
.live-nav{
  bottom:calc(10px + env(safe-area-inset-bottom));
  width:min(650px,calc(100% - 20px));
  border-radius:22px;
  background:rgba(7,25,35,.96);
}

/* LIBRARY */
.modern-library{display:grid;gap:14px}
.library-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}
.library-add-custom{
  width:46px;
  height:46px;
  border:0;
  border-radius:15px;
  background:var(--modern-navy);
  color:#fff;
  font-size:22px;
}
.library-search-wrap{
  display:grid;
  grid-template-columns:28px 1fr 42px;
  align-items:center;
  gap:7px;
  padding:7px 8px 7px 12px;
  border:1px solid var(--line);
  border-radius:20px;
  background:var(--surface);
  box-shadow:0 8px 24px rgba(18,48,71,.06);
}
.library-search-wrap>span{
  color:var(--muted);
  font-size:23px;
}
.library-search-wrap input{
  min-height:45px;
  padding:0;
  border:0;
  background:transparent;
  box-shadow:none;
}
.library-search-wrap button{
  width:42px;
  height:42px;
  border:0;
  border-radius:13px;
  background:var(--surface2);
  color:var(--modern-navy);
}
.library-category-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.library-category-grid button{
  min-height:88px;
  padding:10px 8px;
  border:1px solid var(--line);
  border-radius:18px;
  background:var(--surface);
  color:var(--text);
}
.library-category-grid button.active{
  border-color:var(--modern-teal);
  background:rgba(32,184,176,.09);
}
.library-category-grid span{
  display:block;
  color:var(--modern-teal-dark);
  font-size:25px;
}
.library-category-grid strong{
  display:block;
  margin-top:4px;
  font-size:10px;
}
.library-category-grid small{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-size:8px;
}
.library-filter-row{
  display:flex;
  gap:7px;
  overflow:auto;
  padding-bottom:2px;
  scrollbar-width:none;
}
.library-filter-row::-webkit-scrollbar{display:none}
.library-filter-row button{
  flex:0 0 auto;
  min-height:36px;
  padding:7px 11px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--surface);
  color:var(--muted);
  font-size:9px;
  font-weight:900;
}
.library-filter-row button.active{
  border-color:var(--modern-teal);
  background:var(--modern-teal);
  color:#fff;
}
.library-results{
  padding:15px;
  border:1px solid var(--line);
  border-radius:24px;
  background:var(--surface);
  box-shadow:0 10px 28px rgba(18,48,71,.06);
}
.result-count{
  display:grid;
  place-items:center;
  min-width:40px;
  height:40px;
  border-radius:13px;
  background:var(--surface2);
  color:var(--modern-teal-dark);
  font-weight:950;
}
.modern-library-group>h4{
  display:flex;
  justify-content:space-between;
  margin:17px 2px 8px;
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.08em;
}
.modern-exercise-list{display:grid;gap:8px}
.modern-database-item{
  display:grid;
  grid-template-columns:44px 1fr auto;
  align-items:center;
  gap:10px;
  margin:0;
  padding:10px;
  border-radius:16px;
  background:var(--surface2);
}
.database-glyph{
  display:grid;
  place-items:center;
  width:44px;
  height:44px;
  border-radius:14px;
  background:var(--surface);
  color:var(--modern-teal-dark);
  font-size:22px;
}
.database-copy{min-width:0}
.database-copy h4{
  margin:0;
  font-size:12px;
}
.database-copy p{
  margin:3px 0 0;
  color:var(--muted);
  font-size:9px;
}
.quality-tag{
  display:inline-block;
  margin-top:5px;
  color:#0B8E88;
  font-size:8px;
  font-weight:950;
}
.video-row-btn{
  width:40px;
  height:40px;
  border:1px solid rgba(32,184,176,.35);
  border-radius:13px;
  background:rgba(32,184,176,.08);
  color:var(--modern-teal-dark);
}
body.dark .workout-hero{box-shadow:0 20px 45px rgba(0,0,0,.35)}
body.dark .modern-plan-section,
body.dark .library-results,
body.dark .modern-week-strip,
body.dark .library-category-grid button,
body.dark .library-search-wrap{
  background:var(--surface);
}
body.dark .preview-card-body,
body.dark .modern-database-item{
  background:#122D3A;
}
body.dark .exercise-category-icon,
body.dark .database-glyph{
  background:#173847;
}
body.dark .modern-live-set,
body.dark .modern-saved-sets,
body.dark .modern-previous{
  background:#EAF1F4;
}
@media(max-width:430px){
  .modern-today-head h2,.library-header h2{font-size:24px}
  .hero-actions{grid-template-columns:1fr}
  .modern-exercise-card summary{
    grid-template-columns:29px 31px minmax(0,1fr) 49px 12px;
    gap:6px;
  }
  .preview-video-button{
    min-width:48px;
    width:48px;
    padding:6px;
  }
  .preview-video-button span{display:none}
  .modern-live-hero{
    grid-template-columns:52px 1fr auto;
  }
  .modern-live-glyph{
    width:52px;
    height:52px;
  }
  .modern-video-btn{
    min-width:48px;
    width:48px;
    overflow:hidden;
    white-space:nowrap;
    color:transparent;
  }
  .modern-video-btn::first-letter{color:#0B8E88}
  .live-round-metrics div{
    min-height:72px;
    border-width:4px;
  }
  .live-round-metrics strong{font-size:15px}
  .library-category-grid{grid-template-columns:repeat(3,1fr)}
}


/* ============================================================
   v53 – exercise guide images
   ============================================================ */
.hero-preview-thumb,
.exercise-guide-thumb,
.database-guide-thumb,
.library-guide-thumb{
  display:block;
  object-fit:cover;
  object-position:50% 18%;
  background:#fff;
  border:1px solid var(--line);
}

.hero-preview-thumb{
  width:32px;
  height:32px;
  border-radius:10px;
}

.exercise-guide-thumb{
  width:34px;
  height:42px;
  border-radius:10px;
}

.database-guide-thumb{
  width:48px;
  height:55px;
  border-radius:13px;
}

.library-guide-thumb{
  width:52px;
  height:58px;
  flex:0 0 auto;
  border-radius:13px;
}

.library-guide-fallback{
  display:grid;
  place-items:center;
  width:52px;
  height:52px;
  flex:0 0 auto;
  border-radius:13px;
  background:var(--surface);
  color:var(--modern-teal-dark);
  font-size:23px;
}

.library-item{
  align-items:center;
}

.library-recommend{
  position:relative;
  overflow:hidden;
}

.library-recommend-thumb{
  float:left;
  width:72px;
  height:82px;
  margin:0 11px 8px 0;
  border:1px solid var(--line);
  border-radius:14px;
  object-fit:cover;
  object-position:50% 18%;
  background:#fff;
}

.modern-live-guide{
  display:grid;
  grid-template-columns:76px 1fr 25px;
  align-items:center;
  gap:11px;
  width:100%;
  margin-top:12px;
  padding:8px;
  border:1px solid #D7E7EC;
  border-radius:17px;
  background:#EEF5F7;
  color:#173E58;
  text-align:left;
}

.modern-live-guide img{
  width:76px;
  height:70px;
  border-radius:12px;
  object-fit:cover;
  object-position:50% 18%;
  background:#fff;
}

.modern-live-guide b{
  display:block;
  font-size:12px;
}

.modern-live-guide small{
  display:block;
  margin-top:3px;
  color:#708594;
  font-size:9px;
}

.modern-live-guide i{
  color:#0B8E88;
  font-size:25px;
  font-style:normal;
}

.guide-modal{
  width:min(95vw,720px)!important;
}

.video-guide-wrap{
  margin:12px 0;
  padding:8px;
  border:1px solid var(--line);
  border-radius:18px;
  background:var(--surface2);
  text-align:center;
}

.video-guide-wrap[hidden]{
  display:none;
}

.video-guide-wrap img{
  display:block;
  width:100%;
  max-height:62vh;
  margin:auto;
  border-radius:13px;
  object-fit:contain;
  background:#fff;
  cursor:zoom-in;
  transition:max-height .2s ease;
}

.video-guide-wrap.expanded img{
  max-height:none;
  cursor:zoom-out;
}

.video-guide-wrap p{
  margin:7px 4px 2px;
  color:var(--muted);
  font-size:9px;
}

.video-external-action{
  margin:12px 0 2px;
  text-align:center;
}

.video-external-action a{
  display:inline-block;
  text-decoration:none;
}

body.dark .modern-live-guide{
  background:#EAF1F4;
}

@media(max-width:430px){
  .modern-exercise-card summary{
    grid-template-columns:29px 35px minmax(0,1fr) 49px 12px;
  }

  .exercise-guide-thumb{
    width:35px;
    height:43px;
  }

  .database-guide-thumb{
    width:44px;
    height:52px;
  }

  .modern-live-guide{
    grid-template-columns:68px 1fr 20px;
  }

  .modern-live-guide img{
    width:68px;
    height:64px;
  }
}


/* v55 flexible schedule */
.selected-workout-date{margin-top:5px!important;color:var(--text)!important;font-size:12px!important;font-weight:900;text-transform:capitalize}
.flex-day-card{display:grid;grid-template-columns:46px 1fr auto;gap:11px;align-items:center;padding:14px;border:1px solid rgba(32,184,176,.28);border-radius:20px;background:rgba(32,184,176,.07)}

.app-toast{
  position:fixed;
  left:50%;
  bottom:calc(88px + env(safe-area-inset-bottom));
  z-index:240;
  max-width:min(88vw,520px);
  transform:translate(-50%,18px);
  padding:11px 15px;
  border-radius:14px;
  background:#143a52;
  color:#fff;
  box-shadow:0 12px 30px rgba(0,0,0,.28);

  font-weight:900;
  line-height:1.35;
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease,transform .18s ease;

<body>
<div class="app">
<header>
  <div class="toprow">
    <div class="brand"><img src="icon-192.png" alt="Pokorný Gym Tracker"><div><div class="brand-title-row"><h1>Gym Tracker</h1><span class="app-version">v64</span></div><p class="subtitle" id="appSubtitle"></p></div></div>
    </div>
  <div id="cloudStatus"></div>
</header>

<div class="app-update-banner" id="appUpdateBanner" hidden>
  <div><b id="appUpdateTitle">Je dostupná nová verze</b><span id="appUpdateText">Aktualizace opravuje načítání obrázků a offline režim.</span></div>
  <button type="button" onclick="applyAppUpdate()" id="appUpdateApply">Aktualizovat</button>
  <button type="button" class="update-later" onclick="hideUpdateBanner()">Později</button>
</div>

<div class="workout-running" id="workoutRunning">
  <span id="runningDay"></span><strong id="runningTime">00:00</strong>
  <button class="smallbtn" onclick="openLiveWorkout()" id="resumeBtn"></button>
  <button class="danger" onclick="askFinishWorkout()">✕</button>
</div>

<div class="image-storage-banner" id="imageStorageBanner" hidden>
  <div>
    <b id="imageStorageTitle">Obrázky cviků nejsou dostupné</b>
    <span id="imageStorageText">Zkontroluj nahrání souborů do Supabase Storage.</span>
  </div>
  <button type="button" onclick="checkExerciseImageStorage(true)" id="imageStorageRetry">Zkusit znovu</button>
  <button type="button" class="storage-close" onclick="imageStorageBanner.hidden=true">✕</button>
</div>

<div class="app-toast" id="appToast" role="status" aria-live="polite" hidden></div>

<main>
  <section class="screen active" id="monday"></section>
  <section class="screen" id="wednesday"></section>
  <section class="screen" id="friday"></section>
  <section class="screen" id="progress"></section>
  <section class="screen" id="database"></section>
  <section class="screen" id="history"></section>
  <section class="screen" id="more"></section>
</main>
</div>

<nav><div class="navinner">
  <button class="navbtn active" data-screen="today" id="navTodayBtn" onclick="showToday(recommendedDay())"><span class="nav-glyph">⌂</span><b id="navToday"></b></button>
  <button class="navbtn" data-screen="history" onclick="showScreen('history',this)"><span class="nav-glyph">◔</span><b id="navHistory"></b></button>
  <button class="navbtn" data-screen="database" onclick="showScreen('database',this)"><span class="nav-glyph">▦</span><b id="navDatabase"></b></button>
  <button class="navbtn" data-screen="more" onclick="showScreen('more',this)"><span class="nav-glyph">•••</span><b id="navMore"></b></button>

<div class="toast" id="undoToast"><span id="undoToastText"></span><button id="undoToastBtn" onclick="undoLastSet()"></button></div>

      <button onclick="minimizeLive()">‹</button>

  </div>

  </div></div>
</div>

<dialog id="editSetDialog">

</div></dialog>

</div></dialog>

<dialog id="cloudDialog"><div class="modal">

    <div class="actions"><button class="primary" onclick="syncNow()" id="syncBtn"></button><button class="danger" onclick="cloudSignOut()" id="signOutBtn"></button></div>
  </div>
</div></dialog>

function saveState(sync=true){
 state.version=VERSION;localStorage.setItem(KEY,JSON.stringify(state));
 if(sync)scheduleCloud();
}
function prepareDay(day){
 const d=state.days[day]||defaultDay(selectedWorkoutDate||today());
 state.days[day]={...defaultDay(d.date||selectedWorkoutDate||today()),...d,entries:d.entries||{},extras:d.extras||[],order:d.order||[]};
 ensureOrder(day);
}
function baseInstances(day){
 return BASE_PLANS[day].items.map(c=>({instanceId:`base:${day}:${c.id}`,exerciseId:c.id,sets:c.sets,range:c.range,added:false}));
}
function dayInstances(day){
 prepareDay(day);
 const d=state.days[day],all=[...baseInstances(day),...(d.extras||[]).map(x=>({...x,added:true}))];
 const map=Object.fromEntries(all.map(x=>[x.instanceId,x]));
 const order=[...(d.order||[])].filter(x=>map[x]);
 all.forEach(x=>{if(!order.includes(x.instanceId))order.push(x.instanceId)});
 d.order=order;
 return order.map(x=>map[x]);
}
function ensureOrder(day){const d=state.days[day];if(!d)return;const ids=[...baseInstances(day).map(x=>x.instanceId),...(d.extras||[]).map(x=>x.instanceId)];d.order=(d.order||[]).filter(x=>ids.includes(x));ids.forEach(x=>{if(!d.order.includes(x))d.order.push(x)})}
function entry(day,id){const d=state.days[day];d.entries=d.entries||{};d.entries[id]=d.entries[id]||{sets:[],notes:"",done:false,replacementId:""};return d.entries[id]}
function metaFor(day,inst){
 const e=entry(day,inst.instanceId),item=EX[e.replacementId]||EX[inst.exerciseId];
 return {...item,sets:e.replacementId?item.sets:(inst.sets||item.sets),range:e.replacementId?item.range:(inst.range||item.range),originalId:inst.exerciseId,replacementId:e.replacementId||""};
}
function itemName(item){return item[lang()]||item.en||item.cs}
function categoryName(cat){return CATEGORIES[cat]?.[lang()]||CATEGORIES[cat]?.en||cat}
function targetText(m){
 if(m.mode==="cardio")return m.range;
 if(m.mode==="time")return `${m.sets} × ${m.range} s`;
 if(m.mode==="sidetime")return `${m.sets} × ${m.range} s / ${lang()==="cs"?"strana":"side"}`;
 if(m.mode==="sideweight")return `${m.sets} × ${m.range} / ${lang()==="cs"?"strana":"side"}`;
 return `${m.sets} × ${m.range}`;
}
function hasSetData(mode,s){
 if(!s)return false;
 if(mode==="weight")return !!(s.kg||s.reps);
 if(mode==="reps")return !!s.reps;
 if(mode==="time")return !!s.seconds;
 if(mode==="sideweight")return !!(s.kg||s.left||s.right);
 if(mode==="sidetime")return !!(s.leftSeconds||s.rightSeconds);
 return false;
}
function nonemptySets(rec){return (rec.sets||[]).filter(s=>hasSetData(rec.mode,s))}
function historyFor(id){return state.history[id]||[]}
function lastRecord(id){const a=historyFor(id);return a.length?a[a.length-1]:null}
function formatRecord(rec){
 if(!rec)return "";
 if(rec.mode==="cardio")return `${rec.minutes||"–"} min${rec.speed?` • ${rec.speed} km/h`:""}`;
 return nonemptySets(rec).map(s=>{
   if(rec.mode==="weight")return `${s.kg||"–"}×${s.reps||"–"}`;
   if(rec.mode==="reps")return `${s.reps||"–"}×`;
   if(rec.mode==="time")return `${s.seconds||"–"}s`;
   if(rec.mode==="sideweight")return `${s.kg||"–"} kg • L ${s.left||"–"} / ${lang()==="cs"?"P":"R"} ${s.right||"–"}`;
   if(rec.mode==="sidetime")return `L ${s.leftSeconds||"–"}s / ${lang()==="cs"?"P":"R"} ${s.rightSeconds||"–"}s`;
   return "";
 }).join(" / ");
}
function updateEntry(day,id,field,value){entry(day,id)[field]=value;saveState()}
function updateSet(day,id,index,field,value){
 const e=entry(day,id);e.sets=e.sets||[];e.sets[index]=e.sets[index]||{};e.sets[index][field]=value;saveState();
}

function prefillFieldsForMode(mode){
 if(mode==="weight")return ["kg","reps"];
 if(mode==="reps")return ["reps"];
 if(mode==="time")return ["seconds"];
 if(mode==="sideweight")return ["kg","left","right"];
 if(mode==="sidetime")return ["leftSeconds","rightSeconds"];
 return [];
}
function ensurePrefill(day,inst,m,e,index=0){
 let changed=false;
 e.sets=e.sets||[];
 if(m.mode==="cardio"){
   const last=lastRecord(m.id);
   if(!e.minutes&&last?.minutes){e.minutes=last.minutes;changed=true}
   if(m.id!=="treadmill"&&!e.speed&&last?.speed){e.speed=last.speed;changed=true}
 }else{
   e.sets[index]=e.sets[index]||{};
   const last=lastRecord(m.id),fields=prefillFieldsForMode(m.mode);
   const source=index===0?(last?.sets?.[0]||{}):(e.sets[index-1]||{});
   fields.forEach(field=>{
     if((e.sets[index][field]===undefined||e.sets[index][field]==="")&&source[field]!==undefined&&source[field]!==""){
       e.sets[index][field]=source[field];
       changed=true;
     }
   });
 }
 if(changed)saveState();
 return changed;
}

function setRows(day,inst,m,e){
 ensurePrefill(day,inst,m,e);
 if(m.mode==="cardio"){
  return `<div class="setrow"><div class="sethead"><span>Kardio</span></div><div class="inputs">
   <input inputmode="numeric" placeholder="${t("minutes")}" value="${esc(e.minutes)}" oninput="updateEntry('${day}','${inst.instanceId}','minutes',this.value)">
   <input inputmode="decimal" placeholder="${t("speed")}" value="${esc(e.speed)}" oninput="updateEntry('${day}','${inst.instanceId}','speed',this.value)">
  </div></div>`;
 }
 let out="";
 for(let i=0;i<m.sets;i++){
  const s=e.sets?.[i]||{};
  let inputs="";
  if(m.mode==="weight")inputs=`<div class="inputs"><input inputmode="decimal" placeholder="kg" value="${esc(s.kg)}" oninput="updateSet('${day}','${inst.instanceId}',${i},'kg',this.value)"><input inputmode="numeric" placeholder="${t("reps")}" value="${esc(s.reps)}" oninput="updateSet('${day}','${inst.instanceId}',${i},'reps',this.value)"></div>`;
  if(m.mode==="reps")inputs=`<div class="inputs one"><input inputmode="numeric" placeholder="${t("reps")}" value="${esc(s.reps)}" oninput="updateSet('${day}','${inst.instanceId}',${i},'reps',this.value)"></div>`;
  if(m.mode==="time")inputs=`<div class="inputs one"><input inputmode="numeric" placeholder="${t("seconds")}" value="${esc(s.seconds)}" oninput="updateSet('${day}','${inst.instanceId}',${i},'seconds',this.value)"></div>`;
  if(m.mode==="sideweight")inputs=`<div class="inputs three"><input inputmode="decimal" placeholder="kg" value="${esc(s.kg)}" oninput="updateSet('${day}','${inst.instanceId}',${i},'kg',this.value)"><input inputmode="numeric" placeholder="${t("left")}" value="${esc(s.left)}" oninput="updateSet('${day}','${inst.instanceId}',${i},'left',this.value)"><input inputmode="numeric" placeholder="${t("right")}" value="${esc(s.right)}" oninput="updateSet('${day}','${inst.instanceId}',${i},'right',this.value)"></div>`;
  if(m.mode==="sidetime")inputs=`<div class="inputs"><input inputmode="numeric" placeholder="${t("left")} s" value="${esc(s.leftSeconds)}" oninput="updateSet('${day}','${inst.instanceId}',${i},'leftSeconds',this.value)"><input inputmode="numeric" placeholder="${t("right")} s" value="${esc(s.rightSeconds)}" oninput="updateSet('${day}','${inst.instanceId}',${i},'rightSeconds',this.value)"></div>`;
  out+=`<div class="setrow"><div class="sethead"><span>${t("set")} ${i+1}</span></div>${inputs}</div>`;
 }
 return out;
}

function uiDateFromIso(iso){
 const [y,m,d]=String(iso||today()).split("-").map(Number);
 return new Date(y,m-1,d,12,0,0);
}
function uiIsoFromDate(date){
 const y=date.getFullYear();
 const m=String(date.getMonth()+1).padStart(2,"0");
 const d=String(date.getDate()).padStart(2,"0");
 return `${y}-${m}-${d}`;
}
function uiAddDays(iso,days){
 const date=uiDateFromIso(iso);
 date.setDate(date.getDate()+days);
 return uiIsoFromDate(date);
}
function trainingDayForIso(iso){
 const n=uiDateFromIso(iso).getDay();
 if(n===1)return "monday";
 if(n===3)return "wednesday";
 if(n===5)return "friday";
 return "";
}
function categoryGlyph(category){
 const map={
  chest:"◒",back:"⌁",shoulders:"◇",biceps:"⌇",triceps:"⌁",
  quads:"◩",hamstrings:"◫",calves:"△",core:"◎",cardio:"♥"
 };
 return map[category]||"•";
}
function estimateWorkoutMinutes(day,instances){
 let seconds=0;
 instances.forEach(inst=>{
   const m=metaFor(day,inst);
   if(m.mode==="cardio"){
     const found=String(m.range||"").match(/\d+/);
     seconds+=(Number(found?.[0])||10)*60;
   }else{
     seconds+=(Number(m.sets)||3)*((Number(m.rest)||75)+42);
   }
 });
 return Math.max(25,Math.round(seconds/300)*5);
}
function completedWorkoutsThisWeek(){
 const monday=weekStart(today());
 const sunday=uiAddDays(monday,6);
 return (state.workouts||[]).filter(w=>w.type!=="cardio"&&w.completionStatus!=="partial"&&w.date>=monday&&w.date<=sunday).length;
}
function localizedFullDate(iso){
 const d=uiDateFromIso(iso);
 return new Intl.DateTimeFormat(lang()==="cs"?"cs-CZ":"en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(d);
}
function localizedMonthRange(startIso,endIso){
 const f=new Intl.DateTimeFormat(lang()==="cs"?"cs-CZ":"en-GB",{day:"numeric",month:"short"});
 return `${f.format(uiDateFromIso(startIso))} – ${f.format(uiDateFromIso(endIso))}`;
}
function isPlannedStrengthDate(iso){return [1,3,5].includes(uiDateFromIso(iso).getDay())}
function completedWorkoutOnDate(iso){return (state.workouts||[]).some(w=>w.type!=="cardio"&&w.completionStatus!=="partial"&&w.date===iso)}
function partialWorkoutOnDate(iso){return (state.workouts||[]).some(w=>w.type!=="cardio"&&w.completionStatus==="partial"&&w.date===iso)}
function cardioWorkoutOnDate(iso){return (state.workouts||[]).some(w=>w.type==="cardio"&&w.date===iso)}

 else state.days[day]={...defaultDay(iso),...current,date:iso};

function selectScheduleDate(iso){

   const from=localizedFullDate(activeWorkoutDate()),to=localizedFullDate(iso);

  other:{label:"Intenzita",unit:"level",placeholder:"5"}
 };

  treadmill:{label:"Speed",unit:"km/h",placeholder:"5.5"},
  walking:{label:"Speed",unit:"km/h",placeholder:"5.0"},
  bike:{label:"Level / resistance",unit:"level",placeholder:"6"},

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return Math.abs(h)}
function recordSets(rec){if(rec.mode==="cardio")return 1;return nonemptySets(rec).length}
function recordVolume(rec){
 if(rec.mode==="cardio")return +(rec.minutes||0);
 return nonemptySets(rec).reduce((sum,s)=>{
  if(rec.mode==="weight")return sum+(+s.kg||0)*(+s.reps||0);
  if(rec.mode==="reps")return sum+(+s.reps||0);
  if(rec.mode==="time")return sum+(+s.seconds||0)/30;
  if(rec.mode==="sideweight")return sum+(+s.kg||0)*((+s.left||0)+(+s.right||0));
  if(rec.mode==="sidetime")return sum+((+s.leftSeconds||0)+(+s.rightSeconds||0))/60;
  return sum;
 },0);
}
function recentRecords(days=21){
 const cutoff=new Date();cutoff.setDate(cutoff.getDate()-days);const cut=cutoff.toISOString().slice(0,10),out=[];
 Object.entries(state.history).forEach(([id,arr])=>(arr||[]).forEach(r=>{if((r.date||"")>=cut)out.push({...r,exerciseId:id})}));
 return out;
}
function categoryStagnant(cat){
 const ids=LIBRARY.filter(x=>x.category===cat).map(x=>x.id);
 const recs=ids.flatMap(id=>(state.history[id]||[]).map(r=>({...r,id}))).sort((a,b)=>a.date.localeCompare(b.date)).slice(-3);
 if(recs.length<3)return false;
 const scores=recs.map(recordVolume);return scores[2]<=Math.max(scores[0],scores[1])*1.02;
}
function recommendExercise(day){
 const current=new Set(dayInstances(day).map(x=>metaFor(day,x).id));
 const recent=recentRecords(21),setsByCat={};recent.forEach(r=>{const x=EX[r.exerciseId];if(x)setsByCat[x.category]=(setsByCat[x.category]||0)+recordSets(r)});
 const desired={chest:6,back:8,shoulders:5,biceps:4,triceps:4,quads:6,hamstrings:6,calves:4,core:12};
 const prefs={monday:["biceps","triceps","calves","core"],wednesday:["triceps","biceps","calves","chest"],friday:["biceps","triceps","calves","shoulders","core"]}[day];
 const candidates=LIBRARY.filter(x=>x.category!=="cardio"&&!current.has(x.id));
 if(!candidates.length)return null;
 const date=today();let best=null;
 candidates.forEach(x=>{
  const catSets=setsByCat[x.category]||0,def=Math.max(0,(desired[x.category]||4)-catSets);
  const exact=recent.filter(r=>r.exerciseId===x.id),last=exact.sort((a,b)=>a.date.localeCompare(b.date)).at(-1);
  let freshness=8;if(last){const dd=(new Date(date)-new Date(last.date))/86400000;freshness=Math.min(8,Math.max(-8,dd-3))}
  const pi=prefs.indexOf(x.category),pref=pi>=0?6-pi:0;const rotate=hash(date+day+x.id)%9;
  const plateau=categoryStagnant(x.category)?(exact.length?0:5):0;
  const score=def*2.4+pref+freshness+rotate+plateau-(exact.length*2);
  if(!best||score>best.score)best={item:x,score,catSets,plateau:categoryStagnant(x.category),fresh:!last};
 });
 if(!best)return null;
 let reason;
 const anyHistory=Object.values(state.history).some(a=>a.length);
 if(!anyHistory)reason=t("noDataReason");
 else{
  const parts=[`${t("lowVolumeReason")} (${best.catSets}).`];
  if(best.plateau)parts.push(t("plateauReason"));else if(best.fresh)parts.push(t("freshReason"));
  reason=parts.join(" ");
 }
 return {...best,reason};
}

function isExerciseImage(img){

function handleExerciseImageFailure(img){

async function retryExerciseImage(img){

 img.classList.add("exercise-image-retrying");
 try{
   if(navigator.serviceWorker?.controller)navigator.serviceWorker.controller.postMessage({type:"PURGE_URL",url:new URL(original,location.href).href});
   await fetch(original,{cache:"reload"});
 }catch(_){}

 img.setAttribute("src",`${original}${original.includes("?")?"&":"?"}retry=${Date.now()}`);
}
function installExerciseImageRecovery(){

function completeLiveSet(instanceId,index){

 if(m.mode==="reps"){s.reps=liveReps.value.trim();if(!s.reps)return alert(t("enterReps"))}
 if(m.mode==="time"){s.seconds=liveSeconds.value.trim();if(!s.seconds)return alert(t("enterSeconds"))}
 if(m.mode==="sideweight"){s.kg=liveKg.value.trim();s.left=liveLeft.value.trim();s.right=liveRight.value.trim();if(!s.kg||!s.left||!s.right)return alert(t("enterSides"))}
 if(m.mode==="sidetime"){s.leftSeconds=liveLeftSeconds.value.trim();s.rightSeconds=liveRightSeconds.value.trim();if(!s.leftSeconds||!s.rightSeconds)return alert(t("enterSides"))}
 if(m.mode==="cardio"){
  e.minutes=liveMinutes.value.trim();
  e.speed=m.id==="treadmill"?"":(document.getElementById("liveSpeed")?.value||"").trim();
  e.incline="";

  e.done=true;advanceAfterExercise();saveState();renderLive();return;
 }
 e.sets=e.sets||[];lastSetUndo={day,instanceId,index,previous:previousSet,workoutPosition:state.activeWorkout.position};s._complete=true;e.sets[index]=s;
 const complete=e.sets.slice(0,m.sets).filter(x=>x?._complete===true).length>=m.sets;

 saveState();renderLive();showUndoToast();startRest(m.rest,itemName(m),index+1);

function activeWorkoutSetStats(){
 if(!state.activeWorkout)return {doneSets:0,totalSets:0,complete:false};
 const day=state.activeWorkout.day;
 let doneSets=0,totalSets=0;
 activeInstances(day).forEach(inst=>{
   const e=entry(day,inst.instanceId),m=metaFor(day,inst);
   if(m.mode==="cardio"){
     totalSets+=1;
     if(e.done||String(e.minutes||"").trim())doneSets+=1;
     return;
   }
   const planned=Math.max(1,Number(m.sets||inst.sets||1));
   totalSets+=planned;
   doneSets+=(e.sets||[]).slice(0,planned).filter(x=>x?._complete===true).length;
 });
 return {doneSets,totalSets,complete:totalSets>0&&doneSets>=totalSets};
}

       <label><span>${t("date")}</span><input id="progressDate" type="date" value="${today()}"></label>
       <label><span>${t("weight")}</span><div class="measurement-input-with-unit"><input id="progressWeight" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="např. 88.0" onfocus="clearMeasurementZero(this)" onclick="clearMeasurementZero(this)" oninput="sanitizeMeasurementInput(this)"><b>kg</b></div></label>
       <button class="primary" onclick="saveProgressDailyWeight()">${lang()==="cs"?"Uložit váhu":"Save weight"}</button>
     </div>
   </div>

   <div class="measurement-entry-section waist-entry-section">
     <h3>${lang()==="cs"?"Zapsat pas za tento týden":"Record this week's waist"}</h3>
     <div class="daily-progress-entry">
       <label><span>${lang()==="cs"?"Týden od":"Week starting"}</span><input id="progressWaistWeek" type="date" value="${weekStart(today())}"></label>
       <label><span>${t("waist")}</span><div class="measurement-input-with-unit"><input id="progressWaist" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="např. 95.0" onfocus="clearMeasurementZero(this)" onclick="clearMeasurementZero(this)" oninput="sanitizeMeasurementInput(this)"><b>cm</b></div></label>
       <button class="secondary" onclick="saveProgressWeeklyWaist()">${lang()==="cs"?"Uložit pas":"Save waist"}</button>
     </div>
   </div>
 </div>

 <div class="stat-grid measurement-stat-grid">
   <div class="stat"><span>${t("latestWeight")}</span><strong>${latestWeight.weight?esc(latestWeight.weight)+" kg":"–"}</strong><small>${latestWeight.date?formatMeasurementDate(latestWeight.date):""}</small></div>
   <div class="stat featured-stat"><span>${lang()==="cs"?"Průměr tohoto týdne":"This week's average"}</span><strong>${currentStats.average===null?"–":currentStats.average.toFixed(1)+" kg"}</strong><small>${currentStats.count}/7 ${lang()==="cs"?"dní":"days"}</small></div>
   <div class="stat"><span>${t("latestWaist")}</span><strong>${latestWaist.waist?esc(latestWaist.waist)+" cm":"–"}</strong><small>${latestWaist.date?formatMeasurementDate(latestWaist.date):""}</small></div>
 </div>

 <div class="card">
   <div class="section-title-row"><div><span class="eyebrow">${lang()==="cs"?"TÝDNY":"WEEKS"}</span><h3>${lang()==="cs"?"Týdenní průměry":"Weekly averages"}</h3></div></div>
   <div class="weekly-summary-list">${summaries.length?summaries.slice(0,12).map(s=>`<div class="weekly-summary-row">
     <div><strong>${formatMeasurementDate(s.monday)}–${formatMeasurementDate(s.sunday)}</strong><small>${s.count} ${lang()==="cs"?"vážení":"weigh-ins"}${s.waist!==null?` · ${lang()==="cs"?"pas":"waist"} ${s.waist} cm`:""}</small></div>
     <b>${s.average===null?"–":s.average.toFixed(1)+" kg"}</b>
   </div>`).join(""):`<div class="empty">${t("noHistory")}</div>`}</div>
 </div>

 <div class="card"><h3>${t("weightChart")}</h3><canvas id="weightCanvas" width="700" height="220"></canvas></div>
 <div class="card"><h3>${t("waistChart")}</h3><canvas id="waistCanvas" width="700" height="220"></canvas></div>

 <div class="card"><h3>${t("measurements")}</h3>${arr.length?arr.slice().reverse().map(x=>`<div class="history-card"><strong>${formatMeasurementDate(x.date)}</strong><p>${x.weight?esc(x.weight)+" kg":""}${x.weight&&x.waist?" • ":""}${x.waist?esc(x.waist)+" cm":""}</p><div class="actions"><button class="secondary" onclick="editProgress('${x.date}')">${t("edit")}</button><button class="danger" onclick="deleteProgress('${x.date}')">${t("deleteMeasurement")}</button></div></div>`).join(""):`<div class="empty">${t("noHistory")}</div>`}</div>

 <div class="actions progress-backup-actions"><button class="secondary" onclick="exportBackup()">${t("export")}</button><button class="secondary" onclick="importInput.click()">${t("import")}</button></div>`;

 setTimeout(()=>{drawChart("weightCanvas","weight");drawChart("waistCanvas","waist")},0);
}
function saveProgressDailyWeight(){
 const date=document.getElementById("progressDate")?.value||today();
 const value=validNumber(document.getElementById("progressWeight")?.value);
 if(value===null||value<30||value>300){
   alert(lang()==="cs"?"Zadej platnou váhu v kg.":"Enter a valid weight in kg.");
   return;
 }
 upsertProgress(date,String(value),"");
 saveState();
 renderProgress();
 renderMore();
 showToast(lang()==="cs"?"Denní váha byla uložena.":"Daily weight saved.");
}
function saveProgressWeeklyWaist(){
 const selected=document.getElementById("progressWaistWeek")?.value||today();
 const monday=weekStart(selected);
 const value=validNumber(document.getElementById("progressWaist")?.value);
 if(value===null||value<40||value>250){
   alert(lang()==="cs"?"Zadej platný obvod pasu v cm.":"Enter a valid waist measurement in cm.");
   return;
 }
 const existing=progressRecordForDate(monday);
 upsertProgress(monday,existing?.weight||"",String(value));
 saveState();
 renderProgress();
 renderMore();
 showToast(lang()==="cs"?"Týdenní pas byl uložen.":"Weekly waist saved.");
}

function drawChart(id,key){
 const c=document.getElementById(id);if(!c)return;const ctx=c.getContext("2d"),data=state.progress.filter(x=>+x[key]);ctx.clearRect(0,0,c.width,c.height);
 ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue("--line");ctx.lineWidth=1;for(let i=1;i<5;i++){const y=i*c.height/5;ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(c.width-15,y);ctx.stroke()}
 if(data.length<2){ctx.fillStyle=getComputedStyle(document.body).getPropertyValue("--muted");ctx.font="14px sans-serif";ctx.fillText(t("noHistory"),30,40);return}
 const vals=data.map(x=>+x[key]),min=Math.min(...vals),max=Math.max(...vals),span=Math.max(1,max-min);
 ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue("--primary");ctx.lineWidth=4;ctx.beginPath();
 data.forEach((x,i)=>{const px=30+i*(c.width-50)/(data.length-1),py=20+(max-+x[key])*(c.height-45)/span;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();
}
function deleteProgress(date){state.progress=state.progress.filter(x=>x.date!==date);saveState();renderProgress()}
function exportBackup(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.download=`gym-tracker-${today()}.json`;a.click();URL.revokeObjectURL(a.href)}
async function importBackup(file){if(!file)return;try{state=migrateState(JSON.parse(await file.text()));saveState();location.reload()}catch{alert("Invalid backup")}}


function hasMeaningfulLocalData(){
 if(state.activeWorkout)return true;
 if((state.workouts||[]).length)return true;
 if((state.progress||[]).length)return true;
 if(Object.values(state.history||{}).some(items=>(items||[]).length))return true;
 return DAYS.some(day=>{
   const d=state.days?.[day];
   if(!d)return false;
   if(d.completed)return true;
   return Object.values(d.entries||{}).some(e=>{
     if(e?.done||e?.minutes||e?.speed)return true;
     return (e?.sets||[]).some(set=>set?._complete===true||hasSetData("weight",set)||hasSetData("reps",set)||hasSetData("time",set)||hasSetData("sideweight",set)||hasSetData("sidetime",set));
   });
 });
}

function createLocalSafetyBackup(reason="manual"){
 try{
   localStorage.setItem("gymTrackerProV2SafetyBackup",JSON.stringify({
     createdAt:new Date().toISOString(),
     reason,
     data:state
   }));
   return true;
 }catch(error){
   console.error("Safety backup failed",error);
   return false;
 }
}

function scheduleCloud(){if(!cloudUser||!supabaseClient||cloudLoading)return;clearTimeout(cloudTimer);cloudStatus.textContent=t("cloudSaving");cloudStatus.className="cloud-sync";cloudTimer=setTimeout(saveCloud,1100)}
async function saveCloud(){
 if(!cloudUser||!supabaseClient)return;try{const {error}=await supabaseClient.from("gym_app_state").upsert({user_id:cloudUser.id,data:state,updated_at:new Date().toISOString()},{onConflict:"user_id"});if(error)throw error;cloudStatus.textContent=t("cloudSaved");cloudStatus.className="cloud-ok"}catch(e){console.error(e);cloudStatus.textContent=t("cloudError");cloudStatus.className="cloud-error"}
}
async function loadCloud(force=false){
 if(!cloudUser||!supabaseClient)return;
 cloudLoading=true;
 try{
  const {data,error}=await supabaseClient.from("gym_app_state").select("data,updated_at").eq("user_id",cloudUser.id).maybeSingle();
  if(error)throw error;

  if(data?.data&&(force||confirm(lang()==="cs"
    ?"Načíst data z cloudu? Současná data v tomto zařízení budou nejdřív bezpečně zálohována."
    :"Load cloud data? Current device data will be safely backed up first."))){
    createLocalSafetyBackup("before-cloud-load");
    state=migrateState(data.data);
    localStorage.setItem(KEY,JSON.stringify(state));
    location.reload();
  }else if(!data){
    await saveCloud();
  }
 }catch(e){
  console.error(e);
  cloudStatus.textContent=t("cloudError");
  cloudStatus.className="cloud-error";
 }finally{
  cloudLoading=false;
 }
}
async function initCloud(){
 if(!supabaseClient){cloudStatus.textContent=t("cloudSignedOut");return}
 const {data:{session}}=await supabaseClient.auth.getSession();cloudUser=session?.user||null;updateCloudUI();
 supabaseClient.auth.onAuthStateChange((_event,session)=>{cloudUser=session?.user||null;updateCloudUI()});
 window.addEventListener("online",()=>{if(cloudUser)saveCloud()});
}
function updateCloudUI(){
 const signedIn=!!cloudUser;
 if(signedIn){
   cloudStatus.textContent=t("cloudConnected");
   cloudStatus.className="cloud-ok";
   cloudLoggedOut.style.display="none";
   cloudLoggedIn.style.display="block";
   cloudUserEmail.textContent=cloudUser.email||"";
 }else{
   cloudStatus.textContent=t("cloudSignedOut");
   cloudStatus.className="cloud-warning-status";
   cloudLoggedOut.style.display="block";
   cloudLoggedIn.style.display="none";
 }
 document.querySelectorAll(".login-warning").forEach(box=>box.hidden=signedIn);
}
function openCloud(){updateCloudUI();cloudDialog.showModal()}
async function cloudSignUp(){const email=cloudEmail.value.trim(),password=cloudPassword.value;if(!email||password.length<6)return alert("Email / password");const {data,error}=await supabaseClient.auth.signUp({email,password});if(error)return alert(error.message);cloudUser=data.user;updateCloudUI();if(data.session)await saveCloud();alert(t("accountCreated"))}
async function cloudSignIn(){
 const email=cloudEmail.value.trim();
 const password=cloudPassword.value;
 if(!email||!password)return;

 const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
 if(error)return alert(error.message);

 cloudUser=data.user;
 updateCloudUI();
 cloudDialog.close();

 if(hasMeaningfulLocalData()){
   createLocalSafetyBackup("before-first-cloud-sync");
   const uploadLocal=confirm(lang()==="cs"
     ?"Na tomto zařízení jsou místní data nebo rozpracovaný trénink.\n\nOK = uložit tato data do cloudu.\nZrušit = ponechat je v zařízení a nyní cloud nenačítat."
     :"This device contains local data or an active workout.\n\nOK = save this device data to the cloud.\nCancel = keep it on this device and do not load cloud data now.");

   if(uploadLocal){
     await saveCloud();
     alert(lang()==="cs"
       ?"Data z tohoto zařízení byla uložena do cloudu."
       :"This device data was saved to the cloud.");
   }else{
     alert(lang()==="cs"
       ?"Místní data zůstala zachována. Cloudová data nebyla načtena."
       :"Local data was preserved. Cloud data was not loaded.");
   }
 }else{
   await loadCloud(true);
 }
}
async function cloudSignOut(){await supabaseClient.auth.signOut();cloudUser=null;updateCloudUI();cloudDialog.close()}
async function syncNow(){await saveCloud();alert(t("syncDone"))}

let swRegistration=null,reloadingForUpdate=false;
function showUpdateBanner(){
 const banner=document.getElementById("appUpdateBanner");if(!banner)return;
 appUpdateTitle.textContent=lang()==="cs"?"Je dostupná nová verze":"A new version is available";
 appUpdateText.textContent=lang()==="cs"?"Aktualizace opravuje načítání obrázků a offline režim.":"The update improves image loading and offline mode.";
 appUpdateApply.textContent=lang()==="cs"?"Aktualizovat":"Update";
 banner.hidden=false;
}
function hideUpdateBanner(){document.getElementById("appUpdateBanner").hidden=true}
function applyAppUpdate(){if(swRegistration?.waiting)swRegistration.waiting.postMessage({type:"SKIP_WAITING"});else location.reload()}
async function checkForAppUpdate(manual=false){
 if(!("serviceWorker" in navigator)){if(manual)alert(lang()==="cs"?"Tento prohlížeč nepodporuje offline aktualizace.":"This browser does not support offline updates.");return}
 try{
   swRegistration=swRegistration||await navigator.serviceWorker.getRegistration();
   if(!swRegistration)swRegistration=await navigator.serviceWorker.register("./sw.js");
   await swRegistration.update();
   if(swRegistration.waiting)showUpdateBanner();
   else if(manual)alert(lang()==="cs"?`Používáš aktuální verzi v${VERSION}.`:`You are using the current version v${VERSION}.`);
 }catch(error){console.error(error);if(manual)alert(lang()==="cs"?"Kontrola aktualizace se nepodařila. Zkontroluj připojení.":"Update check failed. Check your connection.")}
}
async function registerAppServiceWorker(){
 if(!("serviceWorker" in navigator))return;
 try{
   swRegistration=await navigator.serviceWorker.register("./sw.js");
   if(swRegistration.waiting)showUpdateBanner();
   swRegistration.addEventListener("updatefound",()=>{const worker=swRegistration.installing;if(!worker)return;worker.addEventListener("statechange",()=>{if(worker.state==="installed"&&navigator.serviceWorker.controller)showUpdateBanner()})});
   navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloadingForUpdate)return;reloadingForUpdate=true;location.reload()});
 }catch(error){console.error("Service worker registration failed",error)}
}

function init(){
 installExerciseImageRecovery();
 applyTheme();applyLanguage();showToday(selectedTodayDay,selectedWorkoutDate);restoreActiveWorkout();initCloud();
 registerAppServiceWorker();
 setTimeout(()=>checkExerciseImageStorage(false),1600);
 document.addEventListener("visibilitychange",()=>{if(!document.hidden){updateWorkoutTimes();if(state.activeWorkout?.restEndAt)updateRest()}});
}
init();
</script>
