<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#123047">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<link rel="manifest" href="manifest.webmanifest">
<title>Gym Tracker</title>
<style>
:root{
  --bg:#F3F7F9;
  --surface:#FFFFFF;
  --surface2:#EEF4F6;
  --surface3:#DDECEF;
  --text:#123047;
  --muted:#5F7A8A;
  --line:#CFE0E6;
  --primary:#20B8B0;
  --primary-dark:#123047;
  --good:#2BAE72;
  --warn:#E89B3C;
  --danger:#D55454;
  --shadow:0 10px 30px rgba(18,48,71,.10);
}
body.dark{
  --bg:#081820;
  --surface:#102530;
  --surface2:#123047;
  --surface3:#123047;
  --text:#EAF7FA;
  --muted:#9DB8C5;
  --line:#234757;
  --primary:#20B8B0;
  --primary-dark:#EAF7FA;
  --good:#31C07C;
  --warn:#F2AA49;
  --danger:#F06A6A;
  --shadow:0 12px 34px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:860px;margin:auto;min-height:100vh;padding-bottom:calc(98px + env(safe-area-inset-bottom))}
header{
  position:sticky;top:0;z-index:30;
  padding:calc(13px + env(safe-area-inset-top)) 12px 10px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(16px);border-bottom:1px solid color-mix(in srgb,var(--line) 75%,transparent)
}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:43px;height:43px;border-radius:13px;box-shadow:0 7px 18px rgba(6,75,120,.22)}
h1{font-size:20px;line-height:1;margin:0;letter-spacing:-.025em}
.subtitle{margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.3}
.top-actions{display:flex;gap:7px;align-items:center}
.iconbtn{
  width:43px;height:43px;border:1px solid var(--line);border-radius:13px;background:var(--surface);
  color:var(--text);font-weight:900;box-shadow:0 5px 15px rgba(20,70,105,.06)
}
#cloudStatus{margin:7px 3px 0;font-size:10px;color:var(--muted);font-weight:800}
.cloud-ok{color:var(--good)!important}.cloud-sync{color:var(--primary)!important}.cloud-error{color:var(--bad)!important}
main{padding:12px}
.screen{display:none}.screen.active{display:block}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:20px;
  box-shadow:var(--shadow);padding:14px;margin-bottom:11px
}
.day-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.day-head h2{margin:0;font-size:21px;letter-spacing:-.035em}
.day-head p{margin:4px 0 0;color:var(--muted);font-size:12px}
.meta{display:grid;gap:8px;margin-top:12px}.meta.monday{grid-template-columns:1fr 1fr 1fr}.meta.single{grid-template-columns:1fr}
label span{display:block;margin:0 0 5px;color:var(--muted);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.045em}
input,select,textarea{
  width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface2);
  color:var(--text);padding:11px;outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(11,106,168,.12)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.primary,.secondary,.danger,.warn,.smallbtn{
  border:0;border-radius:12px;padding:11px 13px;font-weight:900
}
.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 8px 20px rgba(11,106,168,.22)}
.secondary{background:var(--surface3);color:var(--primary-dark)}
.danger{background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad)}
.warn{background:color-mix(in srgb,var(--warn) 13%,var(--surface));color:var(--warn)}
.smallbtn{padding:8px 10px;background:var(--surface3);color:var(--primary-dark);font-size:11px}
.full{width:100%}
.recommend{
  border:1px solid color-mix(in srgb,var(--primary) 32%,var(--line));
  background:linear-gradient(145deg,color-mix(in srgb,var(--surface3) 75%,var(--surface)),var(--surface));
  position:relative;overflow:hidden
}
.recommend:after{content:"";position:absolute;right:-35px;top:-45px;width:120px;height:120px;border-radius:50%;background:rgba(85,185,236,.14)}
.recommend-label{font-size:9px;font-weight:950;letter-spacing:.09em;color:var(--primary);text-transform:uppercase}
.recommend h3{margin:5px 0 4px;font-size:18px}.recommend p{margin:0;color:var(--muted);font-size:11px;line-height:1.45;max-width:650px}
.day-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.exercise{
  display:block;background:var(--surface);border:1px solid var(--line);border-radius:17px;
  margin:7px 0;overflow:hidden;box-shadow:0 5px 18px rgba(20,70,105,.055)
}
.exercise[open]{border-color:color-mix(in srgb,var(--primary) 35%,var(--line));box-shadow:0 10px 26px rgba(20,70,105,.11)}
.exercise-summary{
  list-style:none;display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;
  -webkit-tap-highlight-color:transparent
}
.exercise-summary::-webkit-details-marker{display:none}.exercise-summary::marker{display:none}
.donebox{width:22px;height:22px;flex:none;accent-color:var(--good)}
.exercise-main{min-width:0;flex:1}
.exercise-name{font-size:15px;font-weight:950;line-height:1.15}
.exercise-target{margin-top:4px;color:var(--primary);font-size:11px;font-weight:850}
.exercise-last{margin-top:3px;color:var(--muted);font-size:10px}
.replacement-note{display:inline-block;margin-top:4px;color:var(--warn);font-size:9px;font-weight:900}
.chevron{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:.18s}
.exercise[open] .chevron{transform:rotate(225deg);margin-top:6px}
.exercise-body{padding:11px;border-top:1px solid var(--line);background:var(--surface2)}
.sets{display:grid;gap:8px}
.setrow{
  padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);
}
.sethead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;font-size:11px;font-weight:950}
.inputs{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.inputs.one{grid-template-columns:1fr}.inputs.three{grid-template-columns:repeat(3,1fr)}
.inputs input{text-align:center;padding:10px}
.exercise-buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.note{margin-top:9px}
.tip{margin-top:9px;padding:9px 10px;border-radius:12px;background:var(--surface3);font-size:10px;line-height:1.45;color:var(--muted)}
.extra-badge{font-size:8px;padding:4px 6px;border-radius:999px;background:var(--surface3);color:var(--primary);font-weight:950}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:35;
  padding:7px 10px calc(7px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--surface) 94%,transparent);border-top:1px solid var(--line);backdrop-filter:blur(16px)
}
.navinner{max-width:860px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.navbtn{border:0;border-radius:13px;background:transparent;color:var(--muted);padding:8px 4px;font-size:10px;font-weight:900}
.navbtn span{display:block;font-size:19px;margin-bottom:2px}.navbtn.active{background:var(--surface3);color:var(--primary)}
dialog{border:0;padding:0;background:transparent;max-width:none}
dialog::backdrop{background:rgba(2,17,28,.66);backdrop-filter:blur(4px)}
.modal{
  width:min(640px,calc(100vw - 20px));max-height:calc(100vh - 28px);overflow:auto;
  background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:23px;
  padding:17px;box-shadow:0 24px 80px rgba(0,0,0,.35);position:relative
}
.modal.wide{width:min(760px,calc(100vw - 16px))}
.close{position:sticky;float:right;top:0;z-index:2}
.library-search{margin-top:10px}
.category-chips{display:flex;gap:7px;overflow:auto;padding:10px 0 7px}
.chip{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:var(--surface2);color:var(--muted);padding:8px 10px;font-size:10px;font-weight:900}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.library-group h4{margin:16px 0 7px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.library-item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);margin:7px 0}
.library-item-main{min-width:0;flex:1}.library-item-name{font-size:13px;font-weight:950}.library-item-meta{margin-top:3px;color:var(--muted);font-size:9px}.library-item-last{margin-top:4px;color:var(--primary);font-size:10px;font-weight:850}
.replacement-history{margin:12px 0;padding:11px 12px;border-radius:13px;background:var(--surface3);color:var(--primary-dark);font-size:12px;font-weight:850}
.library-recommend{padding:12px;border:1px solid color-mix(in srgb,var(--primary) 35%,var(--line));border-radius:16px;background:var(--surface3);margin:10px 0}
.library-recommend h4{margin:3px 0 4px}.library-recommend p{margin:0;color:var(--muted);font-size:10px;line-height:1.4}
.replacement-recommendations{margin:12px 0 16px;padding:12px;border:1px solid color-mix(in srgb,var(--primary) 42%,var(--line));border-radius:18px;background:var(--surface3)}
.replacement-recommendations-title{margin:0 0 3px;font-size:14px;font-weight:950;color:var(--primary-dark)}
.replacement-recommendations-subtitle{margin:0 0 10px;color:var(--muted);font-size:10px;line-height:1.4}
.replacement-recommendation{display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:center;gap:10px;margin-top:8px;padding:9px;border:1px solid var(--line);border-radius:15px;background:var(--surface)}
.replacement-recommendation:first-of-type{border-color:color-mix(in srgb,var(--primary) 55%,var(--line));box-shadow:0 5px 15px rgba(17,148,151,.08)}
.replacement-recommendation img,.replacement-recommendation-fallback{width:62px;height:68px;border-radius:12px;border:1px solid var(--line);background:#fff;object-fit:cover;object-position:50% 18%}
.replacement-recommendation-fallback{display:grid;place-items:center;font-size:24px}
.replacement-recommendation-main{min-width:0}.replacement-recommendation-name{font-size:12px;font-weight:950;line-height:1.25}.replacement-recommendation-reason{margin-top:3px;color:var(--muted);font-size:9px;line-height:1.3}.replacement-recommendation-last{margin-top:4px;color:var(--primary);font-size:10px;font-weight:850}
.replacement-other-title{margin:15px 0 3px;font-size:11px;font-weight:950;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
@media(max-width:420px){.replacement-recommendation{grid-template-columns:54px minmax(0,1fr)}.replacement-recommendation img,.replacement-recommendation-fallback{width:54px;height:62px}.replacement-recommendation button{grid-column:2;justify-self:start}}
.history-card{padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);margin:8px 0}
.history-card strong{font-size:12px}.history-card p{margin:5px 0 0;color:var(--muted);font-size:10px;line-height:1.45}
.empty{text-align:center;padding:24px;color:var(--muted);font-size:12px}
.progress-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px;border:1px solid var(--line);border-radius:15px;background:var(--surface2)}.stat span{display:block;color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase}.stat strong{display:block;margin-top:5px;font-size:18px}
canvas{width:100%;height:180px;border:1px solid var(--line);border-radius:15px;background:var(--surface2)}
.workout-running{
  display:none;position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  z-index:55;width:min(520px,calc(100% - 18px));align-items:center;gap:8px;padding:8px;
  border:1px solid rgba(255,255,255,.26);border-radius:16px;background:rgba(6,75,120,.94);color:#fff;box-shadow:0 12px 36px rgba(0,0,0,.27)
}
.workout-running.show{display:flex}.workout-running strong{font-variant-numeric:tabular-nums;margin-left:auto}
.live-overlay,.rest-overlay{
  display:none;position:fixed;inset:0;z-index:70;overflow:auto;
  background:radial-gradient(circle at 75% 0%,rgba(98,205,255,.25),transparent 32%),linear-gradient(180deg,#075f96 0,#0a3a5b 28%,#071b29 100%)
}
.live-overlay.show,.rest-overlay.show{display:block}
.live-shell{width:min(760px,100%);min-height:100%;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(105px + env(safe-area-inset-bottom));color:#fff}
.live-top{display:grid;grid-template-columns:48px 1fr auto;gap:9px;align-items:center}
.live-top button{min-height:46px;border:1px solid rgba(255,255,255,.23);border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-weight:900}
.live-clock{text-align:center}.live-clock span{display:block;font-size:9px;letter-spacing:.12em;font-weight:900;opacity:.72}.live-clock strong{display:block;font-size:27px;font-variant-numeric:tabular-nums}
.live-progress{height:6px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:13px}.live-progress div{height:100%;background:#fff;border-radius:inherit}
.live-progress-text{text-align:center;font-size:10px;font-weight:850;opacity:.72;margin-top:6px}
.live-card{margin-top:13px;padding:16px;border-radius:23px;background:#fff;color:#102a43;box-shadow:0 24px 70px rgba(0,0,0,.32)}
.live-card h2{font-size:25px;line-height:1.08;margin:5px 0 4px;letter-spacing:-.035em}.kicker{color:#6d8190;font-size:9px;font-weight:950;text-transform:uppercase;letter-spacing:.08em}
.live-target{color:#0b6aa8;font-size:12px;font-weight:900}.live-last{margin-top:6px;color:#6d8190;font-size:10px}
.video-btn{width:100%;margin-top:13px;border:0;border-radius:14px;padding:13px;background:#e4f5ff;color:#075f96;font-weight:950}
.live-set{margin-top:13px;padding:13px;border:1px solid #d6e7f1;border-radius:17px;background:#f7fbff}.live-set h3{margin:0 0 9px;font-size:16px}
.live-inputs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.live-inputs.one{grid-template-columns:1fr}.live-inputs.three{grid-template-columns:repeat(3,1fr)}
.live-inputs input{min-height:52px;background:#fff;font-size:17px;font-weight:850;text-align:center}
.live-done{width:100%;min-height:52px;margin-top:10px;border:0;border-radius:14px;background:linear-gradient(135deg,#0b6aa8,#55b9ec);color:#fff;font-weight:950}
.live-card details{margin-top:11px;border:1px solid #d6e7f1;border-radius:14px;overflow:hidden}.live-card details summary{list-style:none;padding:11px;color:#5e7484;font-size:11px;font-weight:900}.live-card details summary::-webkit-details-marker{display:none}.live-tech{padding:0 11px 11px;color:#5e7484;font-size:10px;line-height:1.45}.live-tech ul{padding-left:17px}
.live-nav{position:fixed;left:50%;bottom:calc(9px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(736px,calc(100% - 24px));display:grid;grid-template-columns:1fr 1fr;gap:8px}
.live-nav button{min-height:49px;border:1px solid rgba(255,255,255,.23);border-radius:14px;background:rgba(255,255,255,.13);color:#fff;font-weight:950}.live-nav button:last-child{background:#fff;color:#075f96}
.rest-shell{min-height:100%;display:flex;align-items:center;justify-content:center;padding:calc(18px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));color:#fff;text-align:center}
.rest-panel{width:min(520px,100%)}.rest-panel .kicker{color:rgba(255,255,255,.72)}.rest-time{font-size:76px;font-weight:950;font-variant-numeric:tabular-nums;margin:18px 0}.rest-panel h2{margin:0;font-size:22px}.rest-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.rest-actions button{min-height:52px;border:1px solid rgba(255,255,255,.24);border-radius:15px;background:rgba(255,255,255,.14);color:#fff;font-weight:950}.rest-actions button:last-child{background:#fff;color:#075f96}
.rest-overlay.alarm-warning .rest-panel{animation:alarmPulse .42s ease-in-out infinite alternate}.rest-overlay.alarm-warning .rest-time{color:#ffe56b;text-shadow:0 0 26px rgba(255,229,107,.58)}
.rest-overlay.alarm-finished .rest-panel{animation:alarmFinish .18s ease-in-out 4 alternate}.rest-overlay.alarm-finished .rest-time{color:#fff;background:#d83b3b;border-radius:20px}
@keyframes alarmPulse{to{transform:scale(1.035);filter:brightness(1.22)}}
@keyframes alarmFinish{to{transform:scale(1.06)}}
@media(max-width:560px){
  .meta.monday,.progress-grid,.stat-grid{grid-template-columns:1fr}
  .day-tools{grid-template-columns:1fr 1fr}
  .inputs.three,.live-inputs.three{grid-template-columns:1fr}
  .modal{padding:14px}
  .live-card{padding:14px}
}

/* v19 database and compact five-button navigation */
.navinner{grid-template-columns:repeat(5,1fr)}
.navbtn{min-width:0;padding-left:3px;padding-right:3px}
.navbtn b{font-size:9px}
.database-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.database-grid{display:grid;gap:9px}
.database-item{
  display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  padding:12px;border:1px solid var(--line);border-radius:15px;background:var(--surface2)
}
.database-item h4{margin:0;font-size:14px}
.database-item p{margin:4px 0 0;color:var(--muted);font-size:10px}
.database-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.custom-badge{display:inline-block;margin-left:5px;padding:3px 6px;border-radius:999px;background:var(--surface3);color:var(--primary-dark);font-size:8px;font-weight:900}
.custom-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.custom-form-grid .full-row{grid-column:1/-1}
.prefill-note{font-size:9px;color:var(--good);font-weight:850;margin-top:4px}
@media(max-width:560px){
  .custom-form-grid{grid-template-columns:1fr}
  .custom-form-grid .full-row{grid-column:auto}
  .database-item{grid-template-columns:1fr}
  .database-actions{justify-content:flex-start}
  .navbtn span{font-size:17px}
}


/* v20: simpler visual system */
.navinner{grid-template-columns:repeat(4,1fr)}
.navbtn{padding:8px 5px}
.navbtn b{font-size:10px}
.day-switch{
  display:grid;grid-template-columns:repeat(3,1fr);gap:7px;
  padding:5px;background:var(--surface3);border-radius:15px;margin-bottom:12px
}
.day-switch button{
  border:0;border-radius:11px;padding:10px 6px;background:transparent;color:var(--muted);font-weight:900
}
.day-switch button.active{background:var(--surface);color:var(--primary-dark);box-shadow:0 5px 14px rgba(20,70,105,.10)}
.today-intro{margin-bottom:10px}
.resume-card{
  border:1px solid color-mix(in srgb,var(--primary) 42%,var(--line));
  background:linear-gradient(135deg,var(--surface),var(--surface3));
}
.resume-line{display:flex;justify-content:space-between;gap:10px;align-items:center}
.exercise-status{
  width:23px;height:23px;border-radius:50%;border:2px solid var(--line);
  display:grid;place-items:center;font-size:12px;font-weight:950;flex:none
}
.exercise-status.current{border-color:var(--primary);background:var(--surface3);color:var(--primary-dark)}
.exercise-status.done{border-color:var(--good);background:var(--good);color:#fff}
.exercise-status.later{border-color:var(--warn);color:var(--warn)}
.quick-stepper{display:grid;grid-template-columns:46px 1fr 46px;gap:7px;align-items:center}
.quick-stepper button{
  min-height:50px;border:1px solid var(--line);border-radius:13px;background:var(--surface3);
  color:var(--primary-dark);font-size:17px;font-weight:950
}
.quick-stepper input{width:100%}
.set-kind{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;background:var(--surface3);
  border-radius:12px;margin-bottom:9px
}
.set-kind button{
  border:0;border-radius:9px;padding:8px;background:transparent;color:var(--muted);font-weight:900;font-size:11px
}
.set-kind button.active{background:var(--surface);color:var(--primary-dark);box-shadow:0 3px 10px rgba(20,70,105,.10)}
.toast{
  position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  z-index:120;display:none;align-items:center;gap:12px;padding:12px 14px;border-radius:15px;
  background:#102a43;color:#fff;box-shadow:0 14px 35px rgba(0,0,0,.28);font-size:12px;font-weight:850
}
.toast.show{display:flex;animation:toastIn .2s ease forwards}
.toast button{border:0;border-radius:9px;padding:7px 9px;background:#fff;color:#102a43;font-weight:900}
@keyframes toastIn{to{transform:translateX(-50%) translateY(0)}}
.history-list{display:grid;gap:9px}
.history-row{
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  padding:12px;border:1px solid var(--line);border-radius:15px;background:var(--surface2)
}
.history-date{font-size:11px;font-weight:900;color:var(--primary-dark)}
.history-row h4{margin:0;font-size:14px}.history-row p{margin:4px 0 0;color:var(--muted);font-size:10px}
.more-grid{display:grid;gap:9px}
.more-action{
  width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:14px;border:1px solid var(--line);border-radius:15px;background:var(--surface2);
  color:var(--text);font-weight:900;text-align:left
}
.more-action span:last-child{color:var(--muted)}
.live-input-block{display:grid;gap:7px}
.live-input-label{text-align:center;font-size:10px;color:var(--muted);font-weight:850}

  .navbtn span{font-size:18px}
  .resume-line{align-items:flex-start;flex-direction:column}
}


/* v23: clear colour identity for workout days */
.day-switch{
  background:color-mix(in srgb,var(--surface3) 82%,transparent);
  border:1px solid var(--line);
}
.day-switch button{
  display:flex;align-items:center;justify-content:center;gap:7px;
  min-height:44px;transition:transform .15s ease,box-shadow .15s ease,background .15s ease
}
.day-switch button:active{transform:scale(.98)}
.day-dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.9}
.day-switch .day-monday{color:#1476b8}
.day-switch .day-wednesday{color:#7257c7}
.day-switch .day-friday{color:#d26b2f}
.day-switch .day-monday.active{
  color:#0b5f9b;background:linear-gradient(135deg,#e3f4ff,#f7fcff);
  box-shadow:inset 0 0 0 1px rgba(20,118,184,.20),0 5px 14px rgba(20,118,184,.11)
}
.day-switch .day-wednesday.active{
  color:#6546ba;background:linear-gradient(135deg,#f0ebff,#fbf9ff);
  box-shadow:inset 0 0 0 1px rgba(114,87,199,.20),0 5px 14px rgba(114,87,199,.11)
}
.day-switch .day-friday.active{
  color:#b95420;background:linear-gradient(135deg,#fff0e7,#fffaf6);
  box-shadow:inset 0 0 0 1px rgba(210,107,47,.20),0 5px 14px rgba(210,107,47,.11)
}
.calendar-day-note{
  margin:-3px 2px 11px;text-align:center;color:var(--muted);
  font-size:9px;font-weight:850;letter-spacing:.015em
}
.brand img{
  object-fit:cover;
  background:#07385c;
}


/* v24 settings and Monday measurement gate */
.day-head h2{
  font-size:clamp(16px,4.7vw,20px);
  white-space:nowrap;
  letter-spacing:-.035em
}
.day-head>.danger{padding:8px 9px;font-size:10px;flex:none}
.monday-lock{text-align:center;padding:24px 16px;border-style:dashed}
.monday-lock .lock-icon{font-size:28px;margin-bottom:8px}
.monday-lock h3{margin:0 auto;max-width:520px;font-size:14px;line-height:1.45;color:var(--muted)}
button:disabled{opacity:.46;cursor:not-allowed;box-shadow:none}
#more select{min-height:48px;font-weight:800}
#more h3{font-size:15px}
@media(max-width:390px){
  .day-head h2{font-size:15px}
  .day-head{gap:6px}
}


.extra-section-divider{
  display:flex;align-items:center;gap:10px;margin:18px 2px 9px;
  color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.035em;
  text-transform:uppercase
}
.extra-section-divider:before,.extra-section-divider:after{
  content:"";height:1px;flex:1;background:var(--line)
}
.extra-section-divider span{white-space:nowrap}


.set-kind{display:none!important}

/* v27: prevent accidental double/triple-tap zoom in the installed app */
html,body,#app,button,input,select,textarea,label,a,summary{
  touch-action:manipulation;
}
button,.navbtn,.smallbtn,.primary,.secondary,.danger{
  -webkit-tap-highlight-color:transparent;
}


.recommendation-bottom-divider{
  display:flex;align-items:center;gap:10px;margin:22px 2px 10px;

}
.recommendation-bottom-divider:before,
.recommendation-bottom-divider:after{
  content:"";height:1px;flex:1;background:var(--line)
}
.recommendation-bottom-divider span{white-space:nowrap}


.bottom-day-tools{
  margin:18px 0 6px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:15px;
  background:var(--surface);
}
.bottom-day-tools button{
  flex:1;
  min-height:46px;
}


.rotation-banner{margin:10px 0 12px;padding:12px 14px;border-radius:15px;background:linear-gradient(135deg,#e8f6ff,#f7fbff);border:1px solid rgba(31,126,183,.16);display:grid;gap:3px}.rotation-banner span,.rotation-banner small{font-size:10px;color:var(--muted);font-weight:800}.rotation-banner strong{font-size:18px;color:var(--primary-dark)}
.recovery-warning{margin:0 0 12px;padding:11px 13px;border-radius:13px;background:#fff5e8;border:1px solid #f1d2aa;color:#8b581d;font-size:11px;font-weight:850;line-height:1.45}
.weekly-measure-card{margin-top:12px;padding:13px;border:1px solid var(--line);border-radius:15px;background:var(--surface2)}.weekly-measure-card p{margin:4px 0 10px;color:var(--muted);font-size:10px}.weekly-measure-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.today-primary-actions{display:grid;grid-template-columns:1.35fr .85fr;gap:8px;margin-top:12px}.today-primary-actions button{min-height:49px}.cardio-only-btn{white-space:nowrap}
@media(max-width:390px){.today-primary-actions{grid-template-columns:1fr}.weekly-measure-grid{grid-template-columns:1fr 1fr}.rotation-banner strong{font-size:16px}}
body.dark .rotation-banner{background:linear-gradient(135deg,#11374b,#162c39)}body.dark .recovery-warning{background:#3a2a16;border-color:#68502d;color:#f4c987}


.weight-step-row{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:7px;color:var(--muted);font-size:10px;font-weight:850}
.weight-step-row select{width:auto;min-height:32px;padding:5px 28px 5px 9px;font-size:11px}
.side-weight-live{grid-template-columns:1.2fr .9fr .9fr}
#finishDialog[open]{display:block}
#finishDialog .modal{max-height:min(86vh,680px);overflow:auto}

/* v57 – embedded images, daily weight and weekly averages */
.daily-tracking-card{
  display:grid;
  gap:13px;
  padding:15px;
  border:1px solid rgba(32,184,176,.24);
  border-radius:22px;
  background:linear-gradient(145deg,rgba(32,184,176,.08),var(--surface));
}
.tracking-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.tracking-card-head h3{margin:3px 0;font-size:17px}
.tracking-card-head p{margin:0;color:var(--muted);font-size:10px;text-transform:capitalize}
.tracking-scale{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:rgba(32,184,176,.14);font-size:20px}
.daily-weight-row,.weekly-waist-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:9px;
  align-items:end;
}
.daily-weight-row label,.weekly-waist-row label{display:grid;gap:5px}
.daily-weight-row label>span,.weekly-waist-row label>span{font-size:10px;font-weight:900;color:var(--muted)}
.measurement-input-with-unit{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--surface);
  overflow:hidden;
}
.measurement-input-with-unit input{
  width:100%;
  min-width:0;
  border:0!important;
  background:transparent!important;
  font-size:18px!important;
  font-weight:900;
}
.measurement-input-with-unit b{padding:0 12px;color:var(--muted);font-size:11px}
.daily-weight-row button,.weekly-waist-row button{min-height:48px;white-space:nowrap}
.weekly-average-box{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px;
  border-radius:16px;
  background:#143a52;
  color:#fff;
}
.weekly-average-box div{display:grid;gap:2px}
.weekly-average-box span{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#acd9d9}
.weekly-average-box strong{font-size:23px}
.weekly-average-box small{max-width:48%;text-align:right;color:#c7dce6;font-size:9px;line-height:1.4}
.measurement-entry-card{display:grid;gap:15px}
.measurement-entry-section{display:grid;gap:9px;padding-top:6px}
.measurement-entry-section+.measurement-entry-section{border-top:1px solid var(--line);padding-top:15px}
.measurement-entry-section h3{margin:0;font-size:14px}
.daily-progress-entry{display:grid;grid-template-columns:1fr 1fr auto;gap:9px;align-items:end}
.daily-progress-entry label{display:grid;gap:5px}
.daily-progress-entry label>span{font-size:9px;font-weight:900;color:var(--muted)}
.daily-progress-entry button{min-height:48px;white-space:nowrap}
.measurement-stat-grid .stat{display:grid;gap:3px}
.measurement-stat-grid .stat small{font-size:8px;color:var(--muted)}
.measurement-stat-grid .featured-stat{background:#143a52;color:#fff}
.measurement-stat-grid .featured-stat span,.measurement-stat-grid .featured-stat small{color:#c7dce6}
.weekly-summary-list{display:grid;gap:8px}
.weekly-summary-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:11px 0;
  border-bottom:1px solid var(--line);
}
.weekly-summary-row:last-child{border-bottom:0}
.weekly-summary-row div{display:grid;gap:3px}
.weekly-summary-row strong{font-size:11px}
.weekly-summary-row small{font-size:9px;color:var(--muted)}
.weekly-summary-row>b{font-size:17px;color:var(--modern-teal-dark);white-space:nowrap}
.progress-backup-actions{margin-bottom:18px}
body.dark .daily-tracking-card{background:linear-gradient(145deg,rgba(32,184,176,.10),var(--surface))}
@media(max-width:520px){
  .daily-weight-row,.weekly-waist-row{grid-template-columns:1fr}
  .daily-weight-row button,.weekly-waist-row button{width:100%}
  .daily-progress-entry{grid-template-columns:1fr}
  .daily-progress-entry button{width:100%}
  .weekly-average-box{align-items:flex-start}
}

.modern-live-inputs .live-input-block,
.modern-live-inputs .quick-stepper{

}

  overflow:visible;
}
.modern-live-inputs .quick-stepper button{
  box-sizing:border-box;

  min-width:0!important;

  margin:0;

  justify-self:stretch;
}
.modern-live-inputs .quick-stepper input{

  width:100%;
  min-width:0;

/* v60 – compact collapsible measurement card */
.collapsible-measurement{
  display:block;
  padding:0!important;
  overflow:hidden;
}
.measurement-summary{
  list-style:none;
  display:grid;
  grid-template-columns:44px minmax(0,1fr) auto 24px;
  gap:10px;
  align-items:center;
  min-height:72px;
  padding:12px 14px;
  cursor:pointer;
  user-select:none;
}
.measurement-summary::-webkit-details-marker{display:none}
.measurement-summary-icon{
  display:grid;
  place-items:center;
  width:44px;
  height:44px;
  border-radius:14px;
  background:rgba(32,184,176,.14);
  color:var(--modern-teal-dark);
  font-size:19px;
  font-weight:950;
}
.measurement-saved .measurement-summary-icon{
  background:rgba(32,184,176,.18);
}
.measurement-summary-copy{
  display:grid;
  gap:2px;
  min-width:0;
}
.measurement-summary-copy small{
  color:var(--modern-teal-dark);
  font-size:8px;
  font-weight:950;
  letter-spacing:.12em;
}
.measurement-summary-copy strong{
  overflow:hidden;
  color:var(--text);
  font-size:14px;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.measurement-summary-copy em{
  overflow:hidden;
  color:var(--muted);
  font-size:9px;
  font-style:normal;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.measurement-waist-badge{
  padding:5px 7px;
  border-radius:999px;
  background:#fff1cf;
  color:#805d12;
  font-size:8px;
  font-weight:950;
  white-space:nowrap;
}
.measurement-summary-chevron{
  color:var(--muted);
  font-size:24px;
  transition:transform .2s ease;
}
.collapsible-measurement[open] .measurement-summary-chevron{
  transform:rotate(90deg);
}
.measurement-collapse-body{
  display:grid;
  gap:12px;
  padding:2px 14px 14px;
  border-top:1px solid var(--line);
}
.compact-tracking-head{
  padding-top:11px;
}
.measurement-at-bottom{
  margin-top:12px;
  opacity:.96;
}
.measurement-at-bottom .measurement-summary{
  min-height:64px;
}
.measurement-missing{
  border-color:rgba(32,184,176,.35);
  box-shadow:0 6px 18px rgba(27,74,87,.07);
}
.measurement-missing .measurement-summary-icon{
  animation:measurementNudge 1.6s ease-in-out 2;
}
@keyframes measurementNudge{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-2px)}
}
body.dark .measurement-waist-badge{
  background:#4d3b16;
  color:#ffe3a0;
}
@media(max-width:430px){
  .measurement-summary{
    grid-template-columns:40px minmax(0,1fr) 22px;
    gap:9px;
    min-height:66px;
    padding:10px 12px;
  }
  .measurement-summary-icon{
    width:40px;
    height:40px;
  }
  .measurement-waist-badge{
    display:none;
  }
  .measurement-summary-copy strong{font-size:13px}
  .measurement-collapse-body{padding:2px 12px 12px}
}

function dateAtMidnight(value){const [y,m,d]=String(value||today()).split("-").map(Number);return new Date(y,m-1,d)}
function daysBetween(a,b){return Math.round((dateAtMidnight(b)-dateAtMidnight(a))/86400000)}
function weekStart(value=today()){
 const d=dateAtMidnight(value),offset=(d.getDay()+6)%7;d.setDate(d.getDate()-offset);
 const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
 return `${y}-${m}-${day}`;
}

function validNumber(value){

}
function clearMeasurementZero(input){

function sanitizeMeasurementInput(input){
 if(!input)return;
 let value=String(input.value||"").replace(",",".").replace(/[^0-9.]/g,"");

}
function dailyWeightForDate(date){

function weeklyWaistRecord(value=selectedWorkoutDate||today()){

function weeklyWeightStats(value=selectedWorkoutDate||today()){
 const monday=weekStart(value);

 const records=(state.progress||[])
   .filter(p=>{const weight=validNumber(p.weight);return p.date>=monday&&p.date<=sunday&&weight!==null&&weight>=30&&weight<=300})
   .sort((a,b)=>a.date.localeCompare(b.date));

const CATEGORY_VISUAL_EXERCISES={
 chest:"machine_chest_press",
 back:"lat_pulldown",
 shoulders:"machine_shoulder_press",
 biceps:"dumbbell_curl",
 triceps:"triceps_pushdown",
 quads:"hack_squat",
 hamstrings:"hip_thrust",
 calves:"standing_calf_raise",
 core:"cable_crunch",
 cardio:"rowing_machine"
};
function categoryVisualItem(category){
 const preferred=EX[CATEGORY_VISUAL_EXERCISES[category]];
 return preferred||allLibrary().find(x=>x.category===category&&x.guideImage)||allLibrary().find(x=>x.category===category)||null;
}
function categoryVisualImage(category){
 return CATEGORY_VISUAL_IMAGES[category]||"";
}
function categorySubtitle(category,count){
 const cs={
   chest:"Tlaky a rozpažky",
   back:"Přítahy a stahování",
   shoulders:"Tlaky a upažování",
   biceps:"Zdvihy a kladky",
   triceps:"Stlačování a extenze",
   quads:"Dřepy a tlaky na nohy",
   hamstrings:"Zadní stehna a hýždě",
   calves:"Výpony a lýtka",
   core:"Břicho a stabilita",
   cardio:"Vytrvalost a kondice"
 };
 const en={
   chest:"Presses and flyes",
   back:"Rows and pulldowns",
   shoulders:"Presses and raises",
   biceps:"Curls and cables",
   triceps:"Pushdowns and extensions",
   quads:"Squats and leg presses",
   hamstrings:"Hamstrings and glutes",
   calves:"Raises and calf work",
   core:"Abs and stability",
   cardio:"Endurance and conditioning"
 };
 return `${lang()==="cs"?cs[category]:en[category]} · ${count} ${lang()==="cs"?"cviků":"exercises"}`;
}
function showAllExerciseCategories(){
 databaseCategoryFilter="all";
 databaseQuery="";
 renderDatabase();
 requestAnimationFrame(()=>document.getElementById("databaseSearch")?.focus());
}

function renderDatabase(){
 const rawQuery=databaseQuery.trim();
 const showAllMode=rawQuery==="*";
 const q=showAllMode?"":rawQuery.toLowerCase();
 const cat=databaseCategoryFilter||"all";
 let list=allLibrary();

 if(q)list=list.filter(x=>(x.cs+" "+x.en).toLowerCase().includes(q));
 if(cat!=="all")list=list.filter(x=>x.category===cat);

 list.sort((a,b)=>(Number(b.topPick===true)-Number(a.topPick===true))||itemName(a).localeCompare(itemName(b),lang()));

 const counts={};
 allLibrary().forEach(x=>counts[x.category]=(counts[x.category]||0)+1);

 const groups={};
 list.forEach(x=>(groups[x.category]=groups[x.category]||[]).push(x));

 database.innerHTML=`<div class="modern-library">
   <section class="library-header">
     <div><span class="eyebrow">${lang()==="cs"?"DATABÁZE":"DATABASE"}</span><h2>${t("databaseTitle")}</h2><p>${allLibrary().length} ${lang()==="cs"?"cviků pro vlastní trénink":"exercises for your training"}</p></div>
     <button class="library-add-custom" onclick="openCustomExerciseDialog()">＋</button>
   </section>

   <div class="library-search-wrap">
     <span>⌕</span>
     <input id="databaseSearch" value="${esc(showAllMode?"":databaseQuery)}" oninput="setDatabaseQuery(this.value)" placeholder="${t("search")}">
     <button onclick="setDatabaseCategoryFilter('all')" aria-label="${t("all")}">☷</button>
   </div>

   ${!q&&cat==="all"&&!showAllMode?`<section class="visual-category-section">
     <div class="visual-category-heading">
       <div><span class="eyebrow">${lang()==="cs"?"SVALOVÉ SKUPINY":"MUSCLE GROUPS"}</span><h3>${lang()==="cs"?"Vyber část těla":"Choose a body area"}</h3></div>
       <button class="show-all-exercises-btn" onclick="databaseCategoryFilter='all';databaseQuery='*';renderDatabase()">${lang()==="cs"?"Všechny cviky":"All exercises"}</button>
     </div>
     <div class="visual-category-list">
       ${Object.keys(CATEGORIES).map(c=>{
         const image=categoryVisualImage(c);
         const count=counts[c]||0;
         return `<button class="visual-category-card visual-category-${c}" onclick="setDatabaseCategoryFilter('${c}')">
           ${image?`<img src="${image}" alt="" loading="lazy">`:""}
           <span class="visual-category-overlay"></span>
           <span class="visual-category-copy">
             <small>${categoryGlyph(c)} ${categorySubtitle(c,count)}</small>
             <strong>${categoryName(c)}</strong>
           </span>
           <span class="visual-category-arrow">›</span>
         </button>`;
       }).join("")}
     </div>
   </section>`:`<section class="selected-category-hero selected-category-${cat} ${cat==="all"?"search-mode":""}">
     ${cat!=="all"&&categoryVisualImage(cat)?`<img src="${categoryVisualImage(cat)}" alt="" loading="lazy">`:""}
     <span class="selected-category-overlay"></span>
     <div>
       <button class="category-back-btn" onclick="showAllExerciseCategories()">‹ ${lang()==="cs"?"Skupiny":"Categories"}</button>
       <span class="eyebrow">${q?(lang()==="cs"?"VÝSLEDKY HLEDÁNÍ":"SEARCH RESULTS"):(lang()==="cs"?"SVALOVÁ SKUPINA":"MUSCLE GROUP")}</span>
       <h3>${q?(lang()==="cs"?"Nalezené cviky":"Found exercises"):categoryName(cat)}</h3>
       <p>${list.length} ${lang()==="cs"?"cviků":"exercises"}</p>
     </div>
   </section>

   <div class="library-filter-row visual-filter-row">
     <button class="${cat==="all"?"active":""}" onclick="setDatabaseCategoryFilter('all')">${t("all")}</button>
     ${Object.keys(CATEGORIES).map(c=>`<button class="${cat===c?"active":""}" onclick="setDatabaseCategoryFilter('${c}')">${categoryName(c)}</button>`).join("")}
   </div>

   <section class="library-results visual-library-results">
     ${Object.keys(groups).length?Object.entries(groups).map(([category,items])=>`<div class="library-group modern-library-group visual-results-group">
       ${cat==="all"||q?`<h4>${categoryName(category)} <span>${items.length}</span></h4>`:""}
       <div class="modern-exercise-list">${items.map(x=>`<article class="database-item modern-database-item ${x.topPick?"top-pick-item":""}">
         ${x.guideThumb
  ?`<img class="database-guide-thumb" src="${x.guideThumb}" alt="" loading="lazy">`
  :`<div class="database-glyph">${categoryGlyph(x.category)}</div>`}
         <div class="database-copy">
           <div class="database-title-row">
             <h4>${esc(itemName(x))}</h4>
             <div class="database-title-badges">
               ${x.topPick?`<span class="quality-tag">★ ${t("topPick")}</span>`:""}
               ${x.custom?`<span class="custom-badge">${t("customBadge")}</span>`:""}
             </div>
           </div>
           <div class="database-detail-row">
             <strong>${targetText(x)}</strong>
             <span>${categoryName(x.category)}</span>
           </div>
         </div>
         <div class="database-actions">
           <button class="video-row-btn" onclick="openVideo('${x.id}')" aria-label="${lang()==="cs"?"Otevřít návod":"Open guide"}">▶</button>
           ${x.custom?`<button class="danger" onclick="deleteCustomExercise('${x.id}')">✕</button>`:""}
         </div>
       </article>`).join("")}</div>
     </div>`).join(""):`<div class="card empty">${t("noResults")}</div>`}
   </section>`}
 </div>`;
}
function showToast(message){
 const toast=document.getElementById("appToast");
 const text=document.getElementById("appToastText");
 if(!toast||!text)return;
 text.textContent=String(message||"");
 toast.classList.add("show");
 clearTimeout(showToast._timer);
 showToast._timer=setTimeout(()=>toast.classList.remove("show"),2200);
}
function saveState(sync=true){
 state.version=VERSION;
 state.meta={...(state.meta||{}),modifiedAt:Date.now(),cloudUserId:cloudUser?.id||state.meta?.cloudUserId||""};
 persistCurrentState();
 if(sync)scheduleCloud();
}
function prepareDay(day){

function prefillFieldsForMode(mode){

function ensurePrefill(day,inst,m,e,index=0){

 e.sets=e.sets||[];
 if(m.mode==="cardio"){
   const last=lastRecord(m.id);
   if(!e.minutes&&last?.minutes){e.minutes=last.minutes;changed=true}
   if(m.id!=="treadmill"&&!e.speed&&last?.speed){e.speed=last.speed;changed=true}

   e.sets[index]=e.sets[index]||{};

function uiDateFromIso(iso){
 const [y,m,d]=String(iso||today()).split("-").map(Number);
 return new Date(y,m-1,d,12,0,0);
}
function uiIsoFromDate(date){
 const y=date.getFullYear();
 const m=String(date.getMonth()+1).padStart(2,"0");
 const d=String(date.getDate()).padStart(2,"0");
 return `${y}-${m}-${d}`;
}
function uiAddDays(iso,days){
 const date=uiDateFromIso(iso);
 date.setDate(date.getDate()+days);
 return uiIsoFromDate(date);
}
function trainingDayForIso(iso){
 const n=uiDateFromIso(iso).getDay();
 if(n===1)return "monday";
 if(n===3)return "wednesday";

 return "";
}

  chest:"◒",back:"⌁",shoulders:"◇",biceps:"⌇",triceps:"⌁",
  quads:"◩",hamstrings:"◫",calves:"△",core:"◎",cardio:"♥"
 };
 return map[category]||"•";
}
function estimateWorkoutMinutes(day,instances){
 let seconds=0;
 instances.forEach(inst=>{
   const m=metaFor(day,inst);
   if(m.mode==="cardio"){
     const found=String(m.range||"").match(/\d+/);
     seconds+=(Number(found?.[0])||10)*60;
   }else{
     seconds+=(Number(m.sets)||3)*((Number(m.rest)||75)+42);
   }
 });
 return Math.max(25,Math.round(seconds/300)*5);
}

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return Math.abs(h)}
function recordSets(rec){if(rec.mode==="cardio")return 1;return nonemptySets(rec).length}
function recordVolume(rec){
 if(rec.mode==="cardio")return +(rec.minutes||0);
 return nonemptySets(rec).reduce((sum,s)=>{
  if(rec.mode==="weight")return sum+(+s.kg||0)*(+s.reps||0);
  if(rec.mode==="reps")return sum+(+s.reps||0);
  if(rec.mode==="time")return sum+(+s.seconds||0)/30;
  if(rec.mode==="sideweight")return sum+(+s.kg||0)*((+s.left||0)+(+s.right||0));
  if(rec.mode==="sidetime")return sum+((+s.leftSeconds||0)+(+s.rightSeconds||0))/60;
  return sum;
 },0);
}
function recentRecords(days=21){
 const cutoff=new Date();cutoff.setDate(cutoff.getDate()-days);const cut=cutoff.toISOString().slice(0,10),out=[];
 Object.entries(state.history).forEach(([id,arr])=>(arr||[]).forEach(r=>{if((r.date||"")>=cut)out.push({...r,exerciseId:id})}));
 return out;
}
function categoryStagnant(cat){
 const ids=LIBRARY.filter(x=>x.category===cat).map(x=>x.id);
 const recs=ids.flatMap(id=>(state.history[id]||[]).map(r=>({...r,id}))).sort((a,b)=>a.date.localeCompare(b.date)).slice(-3);
 if(recs.length<3)return false;
 const scores=recs.map(recordVolume);return scores[2]<=Math.max(scores[0],scores[1])*1.02;
}

 const desired={chest:6,back:8,shoulders:5,biceps:4,triceps:4,quads:6,hamstrings:6,calves:4,core:12};
 const prefs={monday:["biceps","triceps","calves","core"],wednesday:["triceps","biceps","calves","chest"],friday:["biceps","triceps","calves","shoulders","core"]}[day];
 const candidates=LIBRARY.filter(x=>x.category!=="cardio"&&!current.has(x.id));
 if(!candidates.length)return null;
 const date=today();let best=null;
 candidates.forEach(x=>{
  const catSets=setsByCat[x.category]||0,def=Math.max(0,(desired[x.category]||4)-catSets);
  const exact=recent.filter(r=>r.exerciseId===x.id),last=exact.sort((a,b)=>a.date.localeCompare(b.date)).at(-1);
  let freshness=8;if(last){const dd=(new Date(date)-new Date(last.date))/86400000;freshness=Math.min(8,Math.max(-8,dd-3))}
  const pi=prefs.indexOf(x.category),pref=pi>=0?6-pi:0;const rotate=hash(date+day+x.id)%9;
  const plateau=categoryStagnant(x.category)?(exact.length?0:5):0;
  const score=def*2.4+pref+freshness+rotate+plateau-(exact.length*2);
  if(!best||score>best.score)best={item:x,score,catSets,plateau:categoryStagnant(x.category),fresh:!last};
 });
 if(!best)return null;
 let reason;
 const anyHistory=Object.values(state.history).some(a=>a.length);
 if(!anyHistory)reason=t("noDataReason");
 else{
  const parts=[`${t("lowVolumeReason")} (${best.catSets}).`];
  if(best.plateau)parts.push(t("plateauReason"));else if(best.fresh)parts.push(t("freshReason"));
  reason=parts.join(" ");
 }
 return {...best,reason};
}

function playAlarmTone(start,frequency,duration,type="square",volume=.3){
 const oscillator=audioContext.createOscillator(),gain=audioContext.createGain();
 oscillator.type=type;oscillator.frequency.setValueAtTime(frequency,start);
 gain.gain.setValueAtTime(0.0001,start);
 gain.gain.exponentialRampToValueAtTime(volume,start+.012);
 gain.gain.exponentialRampToValueAtTime(0.0001,start+duration);

function timerBeep(finalBeep=false,secondsLeft=5){

  }else{
   const frequency=880+(5-Math.max(1,Math.min(5,secondsLeft)))*90;
   playAlarmTone(now,frequency,.105,"square",.34);
   playAlarmTone(now+.145,frequency+120,.105,"square",.34);
  }
 }catch{}
}

   byId("restOverlay")?.classList.add("show");updateRest();clearInterval(restTick);restTick=setInterval(updateRest,500);
 }else if(state.activeWorkout.restEndAt){state.activeWorkout.restEndAt=0;saveState(false)}
 setTimeout(()=>{if(state.activeWorkout&&!byId("restOverlay")?.classList.contains("show"))openLiveWorkout()},450);
}

function upsertProgress(date,weight,waist){
 const x=state.progress.find(p=>p.date===date);if(x){if(weight)x.weight=weight;if(waist)x.waist=waist}else state.progress.push({date,weight:weight||"",waist:waist||""});
 state.progress.sort((a,b)=>a.date.localeCompare(b.date));
}

function editProgress(date){
 const x=state.progress.find(p=>p.date===date);if(!x)return;
 showScreen("progress",null);
 setTimeout(()=>{
   const dateInput=document.getElementById("progressDate");
   const weightInput=document.getElementById("progressWeight");
   const waistWeek=document.getElementById("progressWaistWeek");
   const waistInput=document.getElementById("progressWaist");
   if(dateInput)dateInput.value=x.date||date;
   if(weightInput)weightInput.value=x.weight||"";
   if(waistWeek)waistWeek.value=weekStart(x.date||date);
   if(waistInput)waistInput.value=x.waist||"";
   (x.weight?weightInput:waistInput)?.focus();
   window.scrollTo({top:0,behavior:"smooth"});
 },60);
}

function saveMeasurement(){
 const date=document.getElementById("progressDate")?.value||today();
 const weight=String(document.getElementById("progressWeight")?.value||"").trim();
 const waist=String(document.getElementById("progressWaist")?.value||"").trim();
 if(!weight&&!waist)return;
 upsertProgress(date,weight,waist);saveState();renderProgress();
}
function renderProgress(){
 const arr=[...state.progress].sort((a,b)=>a.date.localeCompare(b.date));
 const weightRecords=arr.filter(x=>{const n=validNumber(x.weight);return n!==null&&n>=30&&n<=300});
 const waistRecords=arr.filter(x=>{const n=validNumber(x.waist);return n!==null&&n>=40&&n<=250});
 const latestWeight=weightRecords.at(-1)||{};
 const latestWaist=waistRecords.at(-1)||{};
 const summaries=allWeeklySummaries();
 const currentStats=weeklyWeightStats(today());

 document.getElementById("progress").innerHTML=`<div class="card measurement-entry-card">
   <div class="day-head"><div><h2>${lang()==="cs"?"Měření":"Measurements"}</h2><p>${lang()==="cs"?"Váha každý den, pas jednou týdně":"Weight daily, waist once per week"}</p></div></div>

   <div class="measurement-entry-section">
     <h3>${lang()==="cs"?"Zapsat denní váhu":"Record daily weight"}</h3>
     <div class="daily-progress-entry">
       <label><span>${t("date")}</span><input id="progressDate" type="date" value="${today()}"></label>
       <label><span>${t("weight")}</span><div class="measurement-input-with-unit"><input id="progressWeight" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="např. 88.0" onfocus="clearMeasurementZero(this)" onclick="clearMeasurementZero(this)" oninput="sanitizeMeasurementInput(this)"><b>kg</b></div></label>
       <button class="primary" onclick="saveProgressDailyWeight()">${lang()==="cs"?"Uložit váhu":"Save weight"}</button>
     </div>
   </div>

   <div class="measurement-entry-section waist-entry-section">
     <h3>${lang()==="cs"?"Zapsat pas za tento týden":"Record this week's waist"}</h3>
     <div class="daily-progress-entry">
       <label><span>${lang()==="cs"?"Týden od":"Week starting"}</span><input id="progressWaistWeek" type="date" value="${weekStart(today())}"></label>
       <label><span>${t("waist")}</span><div class="measurement-input-with-unit"><input id="progressWaist" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="např. 95.0" onfocus="clearMeasurementZero(this)" onclick="clearMeasurementZero(this)" oninput="sanitizeMeasurementInput(this)"><b>cm</b></div></label>
       <button class="secondary" onclick="saveProgressWeeklyWaist()">${lang()==="cs"?"Uložit pas":"Save waist"}</button>
     </div>
   </div>
 </div>

 <div class="stat-grid measurement-stat-grid">
   <div class="stat"><span>${t("latestWeight")}</span><strong>${latestWeight.weight?esc(latestWeight.weight)+" kg":"–"}</strong><small>${latestWeight.date?formatMeasurementDate(latestWeight.date):""}</small></div>
   <div class="stat featured-stat"><span>${lang()==="cs"?"Průměr tohoto týdne":"This week's average"}</span><strong>${currentStats.average===null?"–":currentStats.average.toFixed(1)+" kg"}</strong><small>${currentStats.count}/7 ${lang()==="cs"?"dní":"days"}</small></div>
   <div class="stat"><span>${t("latestWaist")}</span><strong>${latestWaist.waist?esc(latestWaist.waist)+" cm":"–"}</strong><small>${latestWaist.date?formatMeasurementDate(latestWaist.date):""}</small></div>
 </div>

 <div class="card">
   <div class="section-title-row"><div><span class="eyebrow">${lang()==="cs"?"TÝDNY":"WEEKS"}</span><h3>${lang()==="cs"?"Týdenní průměry":"Weekly averages"}</h3></div></div>
   <div class="weekly-summary-list">${summaries.length?summaries.slice(0,12).map(s=>`<div class="weekly-summary-row">
     <div><strong>${formatMeasurementDate(s.monday)}–${formatMeasurementDate(s.sunday)}</strong><small>${s.count} ${lang()==="cs"?"vážení":"weigh-ins"}${s.waist!==null?` · ${lang()==="cs"?"pas":"waist"} ${s.waist} cm`:""}</small></div>
     <b>${s.average===null?"–":s.average.toFixed(1)+" kg"}</b>
   </div>`).join(""):`<div class="empty">${t("noHistory")}</div>`}</div>
 </div>

 <div class="card"><h3>${t("weightChart")}</h3><canvas id="weightCanvas" width="700" height="220"></canvas></div>
 <div class="card"><h3>${t("waistChart")}</h3><canvas id="waistCanvas" width="700" height="220"></canvas></div>

 <div class="card"><h3>${t("measurements")}</h3>${arr.length?arr.slice().reverse().map(x=>`<div class="history-card"><strong>${formatMeasurementDate(x.date)}</strong><p>${x.weight?esc(x.weight)+" kg":""}${x.weight&&x.waist?" • ":""}${x.waist?esc(x.waist)+" cm":""}</p><div class="actions"><button class="secondary" onclick="editProgress('${x.date}')">${t("edit")}</button><button class="danger" onclick="deleteProgress('${x.date}')">${t("deleteMeasurement")}</button></div></div>`).join(""):`<div class="empty">${t("noHistory")}</div>`}</div>

 <div class="actions progress-backup-actions"><button class="secondary" onclick="exportBackup()">${t("export")}</button><button class="secondary" onclick="importInput.click()">${t("import")}</button></div>`;

 setTimeout(()=>{drawChart("weightCanvas","weight");drawChart("waistCanvas","waist")},0);
}
function saveProgressDailyWeight(){
 const date=document.getElementById("progressDate")?.value||today();
 const value=validNumber(document.getElementById("progressWeight")?.value);
 if(value===null||value<30||value>300){
   alert(lang()==="cs"?"Zadej platnou váhu v kg.":"Enter a valid weight in kg.");
   return;
 }
 upsertProgress(date,String(value),"");
 saveState();
 renderProgress();
 renderMore();
 showToast(lang()==="cs"?"Denní váha byla uložena.":"Daily weight saved.");
}
function saveProgressWeeklyWaist(){
 const selected=document.getElementById("progressWaistWeek")?.value||today();
 const monday=weekStart(selected);
 const value=validNumber(document.getElementById("progressWaist")?.value);
 if(value===null||value<40||value>250){
   alert(lang()==="cs"?"Zadej platný obvod pasu v cm.":"Enter a valid waist measurement in cm.");
   return;
 }
 const existing=progressRecordForDate(monday);
 upsertProgress(monday,existing?.weight||"",String(value));
 saveState();
 renderProgress();
 renderMore();
 showToast(lang()==="cs"?"Týdenní pas byl uložen.":"Weekly waist saved.");
}

function drawChart(id,key){
 const c=document.getElementById(id);if(!c)return;const ctx=c.getContext("2d"),data=state.progress.filter(x=>+x[key]);ctx.clearRect(0,0,c.width,c.height);
 ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue("--line");ctx.lineWidth=1;for(let i=1;i<5;i++){const y=i*c.height/5;ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(c.width-15,y);ctx.stroke()}
 if(data.length<2){ctx.fillStyle=getComputedStyle(document.body).getPropertyValue("--muted");ctx.font="14px sans-serif";ctx.fillText(t("noHistory"),30,40);return}
 const vals=data.map(x=>+x[key]),min=Math.min(...vals),max=Math.max(...vals),span=Math.max(1,max-min);
 ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue("--primary");ctx.lineWidth=4;ctx.beginPath();
 data.forEach((x,i)=>{const px=30+i*(c.width-50)/(data.length-1),py=20+(max-+x[key])*(c.height-45)/span;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();
}
function deleteProgress(date){state.progress=state.progress.filter(x=>x.date!==date);saveState();renderProgress()}
function exportBackup(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.download=`gym-tracker-${today()}.json`;a.click();URL.revokeObjectURL(a.href)}
async function importBackup(file){if(!file)return;try{state=migrateState(JSON.parse(await file.text()));saveState();location.reload()}catch{alert("Invalid backup")}}


function hasMeaningfulLocalData(){
 if(state.activeWorkout)return true;
 if((state.workouts||[]).length)return true;
 if((state.progress||[]).length)return true;
 if(Object.values(state.history||{}).some(items=>(items||[]).length))return true;
 return DAYS.some(day=>{
   const d=state.days?.[day];
   if(!d)return false;
   if(d.completed)return true;
   return Object.values(d.entries||{}).some(e=>{
     if(e?.done||e?.minutes||e?.speed)return true;
     return (e?.sets||[]).some(set=>set?._complete===true||hasSetData("weight",set)||hasSetData("reps",set)||hasSetData("time",set)||hasSetData("sideweight",set)||hasSetData("sidetime",set));
   });
 });
}

function createLocalSafetyBackup(reason="manual"){
 try{
   localStorage.setItem("gymTrackerProV2SafetyBackup",JSON.stringify({
     createdAt:new Date().toISOString(),
     reason,
     data:state
   }));
   return true;
 }catch(error){
   console.error("Safety backup failed",error);
   return false;
 }
}

function accountStateKey(userId){return `${KEY}:user:${userId}`}
function persistCurrentState(){
 const key=cloudUser?.id?accountStateKey(cloudUser.id):KEY;
 localStorage.setItem(key,JSON.stringify(state));
}
function parsedStateFromStorage(key){
 try{const raw=JSON.parse(localStorage.getItem(key)||"null");return raw?migrateState(raw):null}catch(error){console.error("Stored state is invalid",error);return null}
}
function cloneState(value){return JSON.parse(JSON.stringify(value))}
function stateActivityTimestamp(value){
 const metaTime=Number(value?.meta?.modifiedAt)||0;
 const workoutTime=Math.max(0,...(value?.workouts||[]).map(item=>Number(item?.savedAt)||0));
 return Math.max(metaTime,workoutTime);
}
function uniqueRecords(first=[],second=[],keyFn){
 const result=[],seen=new Set();
 [...first,...second].forEach(item=>{const key=keyFn(item);if(seen.has(key))return;seen.add(key);result.push(cloneState(item))});
 return result;
}
function mergeStates(localValue,remoteValue){
 const local=migrateState(localValue||defaultState()),remote=migrateState(remoteValue||defaultState());
 const localNewer=stateActivityTimestamp(local)>=stateActivityTimestamp(remote);
 const newer=localNewer?local:remote,older=localNewer?remote:local;
 const merged=migrateState(cloneState(newer));
 merged.workouts=uniqueRecords(newer.workouts,older.workouts,item=>item?.savedAt?`saved:${item.savedAt}`:`${item?.type||"strength"}|${item?.date||""}|${item?.day||""}|${item?.minutes||""}|${item?.cardioType||""}`);
 const progress=new Map();
 [...(older.progress||[]),...(newer.progress||[])].forEach(item=>{const previous=progress.get(item.date)||{};progress.set(item.date,{...previous,...cloneState(item),weight:item.weight||previous.weight||"",waist:item.waist||previous.waist||""})});
 merged.progress=[...progress.values()].sort((a,b)=>(a.date||"").localeCompare(b.date||""));
 merged.history={};
 new Set([...Object.keys(older.history||{}),...Object.keys(newer.history||{})]).forEach(id=>{
   merged.history[id]=uniqueRecords(newer.history?.[id],older.history?.[id],item=>`${item?.date||""}|${item?.day||""}|${item?.mode||""}|${JSON.stringify(item?.sets||[])}|${item?.minutes||""}|${item?.speed||""}`);
 });
 merged.customExercises=uniqueRecords(newer.customExercises,older.customExercises,item=>item?.id||`${item?.cs||""}|${item?.en||""}`);
 if(local.activeWorkout){merged.activeWorkout=cloneState(local.activeWorkout);merged.days=cloneState(local.days)}
 merged.meta={...(merged.meta||{}),modifiedAt:Math.max(stateActivityTimestamp(local),stateActivityTimestamp(remote)),cloudUserId:cloudUser?.id||""};
 merged.version=VERSION;
 return merged;
}
function scheduleCloud(){
 if(!cloudUser||!supabaseClient||cloudLoading)return;
 clearTimeout(cloudTimer);cloudStatus.textContent=t("cloudSaving");cloudStatus.className="cloud-sync";
 cloudTimer=setTimeout(()=>saveCloud(),700);
}
async function saveCloud(){
 if(!cloudUser||!supabaseClient)return false;
 if(cloudSavePromise){cloudDirty=true;return cloudSavePromise}
 const userId=cloudUser.id;
 const snapshot=cloneState(state);
 snapshot.meta={...(snapshot.meta||{}),cloudUserId:userId,modifiedAt:Number(snapshot.meta?.modifiedAt)||Date.now()};
 cloudDirty=false;
 cloudSavePromise=(async()=>{
   try{
    const {error}=await supabaseClient.from("gym_app_state").upsert({user_id:userId,data:snapshot,updated_at:new Date(snapshot.meta.modifiedAt).toISOString()},{onConflict:"user_id"});
    if(error)throw error;
    cloudStatus.textContent=t("cloudSaved");cloudStatus.className="cloud-ok";return true;
   }catch(e){
    console.error(e);cloudStatus.textContent=t("cloudError");cloudStatus.className="cloud-error";return false;
   }finally{cloudSavePromise=null}
 })();
 const saved=await cloudSavePromise;
 if(cloudDirty&&cloudUser?.id===userId)return saveCloud();
 return saved;
}
async function fetchCloudState(){
 const {data,error}=await supabaseClient.from("gym_app_state").select("data,updated_at").eq("user_id",cloudUser.id).maybeSingle();
 if(error)throw error;
 if(!data?.data)return null;
 const remote=migrateState(data.data);
 remote.meta={...(remote.meta||{}),modifiedAt:Math.max(Number(remote.meta?.modifiedAt)||0,Date.parse(data.updated_at)||0),cloudUserId:cloudUser.id};
 return remote;
}
async function reconcileCloud(includeCurrentLocal=true){
 if(!cloudUser||!supabaseClient)return false;
 cloudLoading=true;cloudStatus.textContent=t("cloudSaving");cloudStatus.className="cloud-sync";
 try{
   const stored=parsedStateFromStorage(accountStateKey(cloudUser.id));
   let local=stored||defaultState();
   if(includeCurrentLocal&&hasMeaningfulLocalData())local=mergeStates(state,local);
   const remote=await fetchCloudState();
   state=remote?mergeStates(local,remote):migrateState(local);
   state.meta={...(state.meta||{}),modifiedAt:Math.max(stateActivityTimestamp(state),Date.now()),cloudUserId:cloudUser.id};
   persistCurrentState();
   localStorage.removeItem(KEY);
   cloudLoading=false;
   const saved=await saveCloud();
   applyTheme();applyLanguage();showToday(selectedTodayDay,selectedWorkoutDate);renderProgress();renderHistoryScreen();restoreActiveWorkout();
   return saved;
 }catch(e){
   console.error(e);cloudStatus.textContent=t("cloudError");cloudStatus.className="cloud-error";return false;
 }finally{cloudLoading=false}
}
async function loadCloud(){return reconcileCloud(false)}
async function initCloud(){
 if(!supabaseClient){cloudStatus.textContent=t("cloudSignedOut");return}
 const {data:{session}}=await supabaseClient.auth.getSession();cloudUser=session?.user||null;updateCloudUI();
 if(cloudUser)await reconcileCloud(true);else showToday(selectedTodayDay,selectedWorkoutDate);
 supabaseClient.auth.onAuthStateChange((_event,session)=>{cloudUser=session?.user||null;updateCloudUI()});
 window.addEventListener("online",()=>{if(cloudUser)saveCloud()});
}
function updateCloudUI(){
 const signedIn=!!cloudUser;
 if(signedIn){
   cloudStatus.textContent=t("cloudConnected");
   cloudStatus.className="cloud-ok";
   cloudLoggedOut.style.display="none";
   cloudLoggedIn.style.display="block";
   cloudUserEmail.textContent=cloudUser.email||"";
 }else{
   cloudStatus.textContent=t("cloudSignedOut");
   cloudStatus.className="cloud-warning-status";
   cloudLoggedOut.style.display="block";
   cloudLoggedIn.style.display="none";
 }
 document.querySelectorAll(".login-warning").forEach(box=>box.hidden=signedIn);
}
function openCloud(){updateCloudUI();cloudDialog.showModal()}
async function cloudSignUp(){const email=cloudEmail.value.trim(),password=cloudPassword.value;if(!email||password.length<6)return alert("Email / password");const {data,error}=await supabaseClient.auth.signUp({email,password});if(error)return alert(error.message);cloudUser=data.user;updateCloudUI();if(data.session)await reconcileCloud(true);alert(t("accountCreated"))}
async function cloudSignIn(){
 const email=cloudEmail.value.trim();
 const password=cloudPassword.value;
 if(!email||!password)return;

 const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
 if(error)return alert(error.message);

 cloudUser=data.user;
 updateCloudUI();
 cloudDialog.close();

 if(hasMeaningfulLocalData()){
   createLocalSafetyBackup("before-first-cloud-sync");
   const uploadLocal=confirm(lang()==="cs"
     ?"Na tomto zařízení jsou místní data nebo rozpracovaný trénink.\n\nOK = bezpečně je sloučit s daty tohoto účtu.\nZrušit = načíst pouze data účtu; místní kopie zůstane v bezpečnostní záloze."
     :"This device contains local data or an active workout.\n\nOK = safely merge it with this account.\nCancel = load only the account data; the local copy stays in a safety backup.");

   if(uploadLocal){
     const saved=await reconcileCloud(true);
     alert(saved?(lang()==="cs"?"Data zařízení a účtu byla bezpečně sloučena a uložena.":"Device and account data were safely merged and saved."):(lang()==="cs"?"Sloučená data zůstala v telefonu, ale cloudové uložení se nezdařilo.":"Merged data remains on this device, but cloud saving failed."));
   }else{
     await reconcileCloud(false);
   }
 }else{
   await loadCloud();
 }
}
async function cloudSignOut(){
 clearTimeout(cloudTimer);
 const saved=await saveCloud();
 if(!saved){
  alert(lang()==="cs"?"Data se nepodařilo uložit do cloudu. Odhlášení bylo zastaveno, aby se nic neztratilo.":"Cloud save failed. Sign-out was stopped so no data is lost.");
  return;
 }
 const {error}=await supabaseClient.auth.signOut();
 if(error){alert(error.message);return}
 cloudUser=null;
 state=defaultState();
 localStorage.removeItem(KEY);
 localStorage.removeItem("gymSelectedWorkoutDate");
 if(cloudDialog.open)cloudDialog.close();
 location.reload();
}
async function syncNow(){
 clearTimeout(cloudTimer);
 if(!cloudUser)return openCloud();
 const saved=await saveCloud();
 alert(saved?t("syncDone"):(lang()==="cs"?"Synchronizace se nezdařila. Data zůstávají bezpečně uložená v tomto zařízení.":"Sync failed. Your data remains safely stored on this device."));
}

let swRegistration=null,reloadingForUpdate=false,pendingUpdateVersion="";
function getWaitingWorkerVersion(){
 return new Promise(resolve=>{
   const worker=swRegistration?.waiting;
   if(!worker)return resolve("");
   const channel=new MessageChannel();
   const timeout=setTimeout(()=>resolve(""),1200);
   channel.port1.onmessage=event=>{clearTimeout(timeout);resolve(String(event.data?.version||""))};
   worker.postMessage({type:"GET_VERSION"},[channel.port2]);
 });
}
async function showUpdateBanner(){
 const banner=document.getElementById("appUpdateBanner");if(!banner)return;
 pendingUpdateVersion=await getWaitingWorkerVersion();
 const versionLabel=pendingUpdateVersion?` ${pendingUpdateVersion}`:"";
 appUpdateTitle.textContent=lang()==="cs"?`Je dostupná nová verze${versionLabel}`:`A new version${versionLabel} is available`;
 const deferred=!!state.activeWorkout;
 appUpdateText.textContent=deferred
   ?(lang()==="cs"?"Dokonči trénink. Potom můžeš aktualizaci bezpečně nainstalovat.":"Finish the workout first. You can then install the update safely.")
   :(lang()==="cs"?"Klepni na Aktualizovat nyní. Data i přihlášení zůstanou zachované.":"Tap Update now. Your data and sign-in will remain saved.");
 appUpdateApply.textContent=lang()==="cs"?"Aktualizovat nyní":"Update now";
 appUpdateApply.disabled=deferred;
 banner.hidden=false;
}
function hideUpdateBanner(){document.getElementById("appUpdateBanner").hidden=true}
function applyAppUpdate(){
 if(state.activeWorkout)return showUpdateBanner();
 if(swRegistration?.waiting)swRegistration.waiting.postMessage({type:"SKIP_WAITING"});
 else location.reload();
}
async function checkForAppUpdate(manual=false){
 if(!("serviceWorker" in navigator)){if(manual)alert(lang()==="cs"?"Tento prohlížeč nepodporuje offline aktualizace.":"This browser does not support offline updates.");return}
 try{
   swRegistration=swRegistration||await navigator.serviceWorker.getRegistration();
   if(!swRegistration)swRegistration=await navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"});
   await swRegistration.update();
   if(swRegistration.waiting)showUpdateBanner();
   else if(manual)alert(lang()==="cs"?`Používáš aktuální verzi v${VERSION}.`:`You are using the current version v${VERSION}.`);
 }catch(error){console.error(error);if(manual)alert(lang()==="cs"?"Kontrola aktualizace se nepodařila. Zkontroluj připojení.":"Update check failed. Check your connection.")}
}
async function registerAppServiceWorker(){
 if(!("serviceWorker" in navigator))return;
 try{
   swRegistration=await navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"});
   if(swRegistration.waiting)showUpdateBanner();
   swRegistration.addEventListener("updatefound",()=>{const worker=swRegistration.installing;if(!worker)return;worker.addEventListener("statechange",()=>{if(worker.state==="installed"&&navigator.serviceWorker.controller)showUpdateBanner()})});
   navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloadingForUpdate)return;reloadingForUpdate=true;location.reload()});
   await swRegistration.update();
 }catch(error){console.error("Service worker registration failed",error)}
}

function init(){
 installExerciseImageRecovery();
 applyTheme();applyLanguage();showToday(selectedTodayDay,selectedWorkoutDate);restoreActiveWorkout();initCloud();
 registerAppServiceWorker();
 setTimeout(()=>checkExerciseImageStorage(false),1600);
 document.addEventListener("visibilitychange",()=>{if(!document.hidden){updateWorkoutTimes();if(state.activeWorkout?.restEndAt)updateRest();checkForAppUpdate(false)}});
}
init();
</script>
