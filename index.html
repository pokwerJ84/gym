<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5f9b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Gym Tracker</title>
<style>
:root{
  --primary:#0b6aa8;--primary2:#55b9ec;--primary-dark:#064b78;
  --bg:#eef7fc;--surface:#fff;--surface2:#f5fbff;--surface3:#e5f4fc;
  --text:#102a43;--muted:#687f91;--line:#d7e7f1;--good:#138a64;
  --bad:#cf4c4c;--warn:#b66a16;--shadow:0 12px 36px rgba(20,70,105,.11)
}
body.dark{
  --bg:#081722;--surface:#102431;--surface2:#132c3a;--surface3:#183849;
  --text:#eaf6fc;--muted:#9eb6c5;--line:#244352;--shadow:0 12px 36px rgba(0,0,0,.26)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:860px;margin:auto;min-height:100vh;padding-bottom:calc(98px + env(safe-area-inset-bottom))}
header{
  position:sticky;top:0;z-index:30;
  padding:calc(13px + env(safe-area-inset-top)) 12px 10px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(16px);border-bottom:1px solid color-mix(in srgb,var(--line) 75%,transparent)
}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:43px;height:43px;border-radius:13px;box-shadow:0 7px 18px rgba(6,75,120,.22)}
h1{font-size:20px;line-height:1;margin:0;letter-spacing:-.025em}
.subtitle{margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.3}
.top-actions{display:flex;gap:7px;align-items:center}
.iconbtn{
  width:43px;height:43px;border:1px solid var(--line);border-radius:13px;background:var(--surface);
  color:var(--text);font-weight:900;box-shadow:0 5px 15px rgba(20,70,105,.06)
}
#cloudStatus{margin:7px 3px 0;font-size:10px;color:var(--muted);font-weight:800}
.cloud-ok{color:var(--good)!important}.cloud-sync{color:var(--primary)!important}.cloud-error{color:var(--bad)!important}
main{padding:12px}
.screen{display:none}.screen.active{display:block}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:20px;
  box-shadow:var(--shadow);padding:14px;margin-bottom:11px
}
.day-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.day-head h2{margin:0;font-size:21px;letter-spacing:-.035em}
.day-head p{margin:4px 0 0;color:var(--muted);font-size:12px}
.meta{display:grid;gap:8px;margin-top:12px}.meta.monday{grid-template-columns:1fr 1fr 1fr}.meta.single{grid-template-columns:1fr}
label span{display:block;margin:0 0 5px;color:var(--muted);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.045em}
input,select,textarea{
  width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface2);
  color:var(--text);padding:11px;outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(11,106,168,.12)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.primary,.secondary,.danger,.warn,.smallbtn{
  border:0;border-radius:12px;padding:11px 13px;font-weight:900
}
.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 8px 20px rgba(11,106,168,.22)}
.secondary{background:var(--surface3);color:var(--primary-dark)}
.danger{background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad)}
.warn{background:color-mix(in srgb,var(--warn) 13%,var(--surface));color:var(--warn)}
.smallbtn{padding:8px 10px;background:var(--surface3);color:var(--primary-dark);font-size:11px}
.full{width:100%}
.recommend{
  border:1px solid color-mix(in srgb,var(--primary) 32%,var(--line));
  background:linear-gradient(145deg,color-mix(in srgb,var(--surface3) 75%,var(--surface)),var(--surface));
  position:relative;overflow:hidden
}
.recommend:after{content:"";position:absolute;right:-35px;top:-45px;width:120px;height:120px;border-radius:50%;background:rgba(85,185,236,.14)}
.recommend-label{font-size:9px;font-weight:950;letter-spacing:.09em;color:var(--primary);text-transform:uppercase}
.recommend h3{margin:5px 0 4px;font-size:18px}.recommend p{margin:0;color:var(--muted);font-size:11px;line-height:1.45;max-width:650px}
.day-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.exercise{
  display:block;background:var(--surface);border:1px solid var(--line);border-radius:17px;
  margin:7px 0;overflow:hidden;box-shadow:0 5px 18px rgba(20,70,105,.055)
}
.exercise[open]{border-color:color-mix(in srgb,var(--primary) 35%,var(--line));box-shadow:0 10px 26px rgba(20,70,105,.11)}
.exercise-summary{
  list-style:none;display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;
  -webkit-tap-highlight-color:transparent
}
.exercise-summary::-webkit-details-marker{display:none}.exercise-summary::marker{display:none}
.donebox{width:22px;height:22px;flex:none;accent-color:var(--good)}
.exercise-main{min-width:0;flex:1}
.exercise-name{font-size:15px;font-weight:950;line-height:1.15}
.exercise-target{margin-top:4px;color:var(--primary);font-size:11px;font-weight:850}
.exercise-last{margin-top:3px;color:var(--muted);font-size:10px}
.replacement-note{display:inline-block;margin-top:4px;color:var(--warn);font-size:9px;font-weight:900}
.chevron{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:.18s}
.exercise[open] .chevron{transform:rotate(225deg);margin-top:6px}
.exercise-body{padding:11px;border-top:1px solid var(--line);background:var(--surface2)}
.sets{display:grid;gap:8px}
.setrow{
  padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);
}
.sethead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;font-size:11px;font-weight:950}
.inputs{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.inputs.one{grid-template-columns:1fr}.inputs.three{grid-template-columns:repeat(3,1fr)}
.inputs input{text-align:center;padding:10px}
.exercise-buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.note{margin-top:9px}
.tip{margin-top:9px;padding:9px 10px;border-radius:12px;background:var(--surface3);font-size:10px;line-height:1.45;color:var(--muted)}
.extra-badge{font-size:8px;padding:4px 6px;border-radius:999px;background:var(--surface3);color:var(--primary);font-weight:950}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:35;
  padding:7px 10px calc(7px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--surface) 94%,transparent);border-top:1px solid var(--line);backdrop-filter:blur(16px)
}
.navinner{max-width:860px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.navbtn{border:0;border-radius:13px;background:transparent;color:var(--muted);padding:8px 4px;font-size:10px;font-weight:900}
.navbtn span{display:block;font-size:19px;margin-bottom:2px}.navbtn.active{background:var(--surface3);color:var(--primary)}
dialog{border:0;padding:0;background:transparent;max-width:none}
dialog::backdrop{background:rgba(2,17,28,.66);backdrop-filter:blur(4px)}
.modal{
  width:min(640px,calc(100vw - 20px));max-height:calc(100vh - 28px);overflow:auto;
  background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:23px;
  padding:17px;box-shadow:0 24px 80px rgba(0,0,0,.35);position:relative
}
.modal.wide{width:min(760px,calc(100vw - 16px))}
.close{position:sticky;float:right;top:0;z-index:2}
.library-search{margin-top:10px}
.category-chips{display:flex;gap:7px;overflow:auto;padding:10px 0 7px}
.chip{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:var(--surface2);color:var(--muted);padding:8px 10px;font-size:10px;font-weight:900}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.library-group h4{margin:16px 0 7px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.library-item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);margin:7px 0}
.library-item-main{min-width:0;flex:1}.library-item-name{font-size:13px;font-weight:950}.library-item-meta{margin-top:3px;color:var(--muted);font-size:9px}
.library-recommend{padding:12px;border:1px solid color-mix(in srgb,var(--primary) 35%,var(--line));border-radius:16px;background:var(--surface3);margin:10px 0}
.library-recommend h4{margin:3px 0 4px}.library-recommend p{margin:0;color:var(--muted);font-size:10px;line-height:1.4}
.history-card{padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);margin:8px 0}
.history-card strong{font-size:12px}.history-card p{margin:5px 0 0;color:var(--muted);font-size:10px;line-height:1.45}
.empty{text-align:center;padding:24px;color:var(--muted);font-size:12px}
.progress-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px;border:1px solid var(--line);border-radius:15px;background:var(--surface2)}.stat span{display:block;color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase}.stat strong{display:block;margin-top:5px;font-size:18px}
canvas{width:100%;height:180px;border:1px solid var(--line);border-radius:15px;background:var(--surface2)}
.workout-running{
  display:none;position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  z-index:55;width:min(520px,calc(100% - 18px));align-items:center;gap:8px;padding:8px;
  border:1px solid rgba(255,255,255,.26);border-radius:16px;background:rgba(6,75,120,.94);color:#fff;box-shadow:0 12px 36px rgba(0,0,0,.27)
}
.workout-running.show{display:flex}.workout-running strong{font-variant-numeric:tabular-nums;margin-left:auto}
.live-overlay,.rest-overlay{
  display:none;position:fixed;inset:0;z-index:70;overflow:auto;
  background:radial-gradient(circle at 75% 0%,rgba(98,205,255,.25),transparent 32%),linear-gradient(180deg,#075f96 0,#0a3a5b 28%,#071b29 100%)
}
.live-overlay.show,.rest-overlay.show{display:block}
.live-shell{width:min(760px,100%);min-height:100%;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(105px + env(safe-area-inset-bottom));color:#fff}
.live-top{display:grid;grid-template-columns:48px 1fr auto;gap:9px;align-items:center}
.live-top button{min-height:46px;border:1px solid rgba(255,255,255,.23);border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-weight:900}
.live-clock{text-align:center}.live-clock span{display:block;font-size:9px;letter-spacing:.12em;font-weight:900;opacity:.72}.live-clock strong{display:block;font-size:27px;font-variant-numeric:tabular-nums}
.live-progress{height:6px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:13px}.live-progress div{height:100%;background:#fff;border-radius:inherit}
.live-progress-text{text-align:center;font-size:10px;font-weight:850;opacity:.72;margin-top:6px}
.live-card{margin-top:13px;padding:16px;border-radius:23px;background:#fff;color:#102a43;box-shadow:0 24px 70px rgba(0,0,0,.32)}
.live-card h2{font-size:25px;line-height:1.08;margin:5px 0 4px;letter-spacing:-.035em}.kicker{color:#6d8190;font-size:9px;font-weight:950;text-transform:uppercase;letter-spacing:.08em}
.live-target{color:#0b6aa8;font-size:12px;font-weight:900}.live-last{margin-top:6px;color:#6d8190;font-size:10px}
.video-btn{width:100%;margin-top:13px;border:0;border-radius:14px;padding:13px;background:#e4f5ff;color:#075f96;font-weight:950}
.live-set{margin-top:13px;padding:13px;border:1px solid #d6e7f1;border-radius:17px;background:#f7fbff}.live-set h3{margin:0 0 9px;font-size:16px}
.live-inputs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.live-inputs.one{grid-template-columns:1fr}.live-inputs.three{grid-template-columns:repeat(3,1fr)}
.live-inputs input{min-height:52px;background:#fff;font-size:17px;font-weight:850;text-align:center}
.live-done{width:100%;min-height:52px;margin-top:10px;border:0;border-radius:14px;background:linear-gradient(135deg,#0b6aa8,#55b9ec);color:#fff;font-weight:950}
.live-card details{margin-top:11px;border:1px solid #d6e7f1;border-radius:14px;overflow:hidden}.live-card details summary{list-style:none;padding:11px;color:#5e7484;font-size:11px;font-weight:900}.live-card details summary::-webkit-details-marker{display:none}.live-tech{padding:0 11px 11px;color:#5e7484;font-size:10px;line-height:1.45}.live-tech ul{padding-left:17px}
.live-nav{position:fixed;left:50%;bottom:calc(9px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(736px,calc(100% - 24px));display:grid;grid-template-columns:1fr 1fr;gap:8px}
.live-nav button{min-height:49px;border:1px solid rgba(255,255,255,.23);border-radius:14px;background:rgba(255,255,255,.13);color:#fff;font-weight:950}.live-nav button:last-child{background:#fff;color:#075f96}
.rest-shell{min-height:100%;display:flex;align-items:center;justify-content:center;padding:calc(18px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));color:#fff;text-align:center}
.rest-panel{width:min(520px,100%)}.rest-panel .kicker{color:rgba(255,255,255,.72)}.rest-time{font-size:76px;font-weight:950;font-variant-numeric:tabular-nums;margin:18px 0}.rest-panel h2{margin:0;font-size:22px}.rest-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.rest-actions button{min-height:52px;border:1px solid rgba(255,255,255,.24);border-radius:15px;background:rgba(255,255,255,.14);color:#fff;font-weight:950}.rest-actions button:last-child{background:#fff;color:#075f96}
@media(max-width:560px){
  .meta.monday,.progress-grid,.stat-grid{grid-template-columns:1fr}
  .day-tools{grid-template-columns:1fr 1fr}
  .inputs.three,.live-inputs.three{grid-template-columns:1fr}
  .modal{padding:14px}
  .live-card{padding:14px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="toprow">
    <div class="brand"><img src="icon.svg" alt=""><div><h1>Gym Tracker</h1><p class="subtitle" id="appSubtitle"></p></div></div>
    <div class="top-actions">
      <button class="iconbtn" id="langBtn" onclick="toggleLanguage()">EN</button>
      <button class="iconbtn" onclick="openCloud()">☁️</button>
      <button class="iconbtn" onclick="toggleTheme()">◐</button>
    </div>
  </div>
  <div id="cloudStatus"></div>
</header>

<div class="workout-running" id="workoutRunning">
  <span id="runningDay"></span><strong id="runningTime">00:00</strong>
  <button class="smallbtn" onclick="openLiveWorkout()" id="resumeBtn"></button>
  <button class="danger" onclick="askFinishWorkout()">✕</button>
</div>

<main>
  <section class="screen active" id="monday"></section>
  <section class="screen" id="wednesday"></section>
  <section class="screen" id="friday"></section>
  <section class="screen" id="progress"></section>
</main>
</div>

<nav><div class="navinner">
  <button class="navbtn active" data-screen="monday" onclick="showScreen('monday',this)"><span>🏋️</span><b id="navMon"></b></button>
  <button class="navbtn" data-screen="wednesday" onclick="showScreen('wednesday',this)"><span>💪</span><b id="navWed"></b></button>
  <button class="navbtn" data-screen="friday" onclick="showScreen('friday',this)"><span>🦵</span><b id="navFri"></b></button>
  <button class="navbtn" data-screen="progress" onclick="showScreen('progress',this)"><span>📈</span><b id="navProgress"></b></button>
</div></nav>

<div class="live-overlay" id="liveOverlay">
  <div class="live-shell">
    <div class="live-top">
      <button onclick="minimizeLive()">‹</button>
      <div class="live-clock"><span id="liveLabel"></span><strong id="liveClock">00:00</strong></div>
      <button onclick="askFinishWorkout()" id="liveFinishBtn"></button>
    </div>
    <div class="live-progress"><div id="liveProgressFill"></div></div>
    <div class="live-progress-text" id="liveProgressText"></div>
    <div class="live-card" id="liveContent"></div>
    <div class="live-nav">
      <button onclick="previousLive()" id="prevBtn"></button>
      <button onclick="nextLive()" id="nextBtn"></button>
    </div>
  </div>
</div>

<div class="rest-overlay" id="restOverlay">
  <div class="rest-shell"><div class="rest-panel">
    <div class="kicker" id="restLabel"></div>
    <h2 id="restExercise"></h2>
    <div class="rest-time" id="restTime">01:30</div>
    <div class="rest-actions">
      <button onclick="returnFromRest()" id="restReturnBtn"></button>
      <button onclick="skipRest()" id="restSkipBtn"></button>
    </div>
  </div></div>
</div>

<dialog id="libraryDialog"><div class="modal wide">
  <button class="iconbtn close" onclick="libraryDialog.close()">✕</button>
  <h2 id="libraryTitle" style="margin:3px 0 0"></h2>
  <p class="subtitle" id="librarySubtitle"></p>
  <div id="libraryRecommendation"></div>
  <input class="library-search" id="librarySearch" oninput="renderLibrary()" placeholder="">
  <div class="category-chips" id="categoryChips"></div>
  <div id="libraryList"></div>
</div></dialog>

<dialog id="videoDialog"><div class="modal">
  <button class="iconbtn close" onclick="videoDialog.close()">✕</button>
  <h2 id="videoTitle" style="margin:3px 0"></h2>
  <div id="videoTips"></div>
  <p style="text-align:center"><a id="videoLink" class="primary" style="display:inline-block;text-decoration:none" target="_blank" rel="noopener"></a></p>
</div></dialog>

<dialog id="historyDialog"><div class="modal">
  <button class="iconbtn close" onclick="historyDialog.close()">✕</button>
  <h2 id="historyTitle" style="margin:3px 0"></h2>
  <div id="historyContent"></div>
</div></dialog>

<dialog id="retroDialog"><div class="modal">
  <button class="iconbtn close" onclick="retroDialog.close()">✕</button>
  <h2 id="retroTitle" style="margin:3px 0"></h2>
  <p class="subtitle" id="retroSubtitle"></p>
  <div id="retroFields"></div>
  <div class="actions"><button class="primary full" onclick="saveRetroSet()" id="retroSaveBtn"></button></div>
</div></dialog>

<dialog id="finishDialog"><div class="modal">
  <button class="iconbtn close" onclick="cancelFinish()">✕</button>
  <h2 id="finishTitle" style="margin:3px 0"></h2>
  <div id="finishSummary"></div>
  <label><span id="finishNoteLabel"></span><textarea id="finishNote" rows="3"></textarea></label>
  <div class="actions"><button class="primary full" onclick="saveFinishedWorkout()" id="finishSaveBtn"></button></div>
</div></dialog>

<dialog id="cloudDialog"><div class="modal">
  <button class="iconbtn close" onclick="cloudDialog.close()">✕</button>
  <h2 id="cloudTitle" style="margin:3px 0"></h2>
  <p class="subtitle" id="cloudIntro"></p>
  <div id="cloudLoggedOut">
    <label><span>E-mail</span><input id="cloudEmail" type="email" autocomplete="email"></label>
    <label><span id="passwordLabel"></span><input id="cloudPassword" type="password" autocomplete="current-password"></label>
    <div class="actions"><button class="primary" onclick="cloudSignIn()" id="signInBtn"></button><button class="secondary" onclick="cloudSignUp()" id="signUpBtn"></button></div>
  </div>
  <div id="cloudLoggedIn" style="display:none">
    <p><span id="signedAsLabel"></span><br><b id="cloudUserEmail"></b></p>
    <div class="actions"><button class="primary" onclick="syncNow()" id="syncBtn"></button><button class="danger" onclick="cloudSignOut()" id="signOutBtn"></button></div>
  </div>
</div></dialog>

<input id="importInput" type="file" accept=".json" hidden onchange="importBackup(this.files[0])">

 if(rec.mode==="cardio")return `${rec.minutes||"–"} min${rec.speed?` • ${rec.speed} km/h`:""}`;
 return nonemptySets(rec).map(s=>{
   if(rec.mode==="weight")return `${s.kg||"–"}×${s.reps||"–"}`;
   if(rec.mode==="reps")return `${s.reps||"–"}×`;
   if(rec.mode==="time")return `${s.seconds||"–"}s`;
   if(rec.mode==="sideweight")return `${s.kg||"–"} kg • L ${s.left||"–"} / ${lang()==="cs"?"P":"R"} ${s.right||"–"}`;
   if(rec.mode==="sidetime")return `L ${s.leftSeconds||"–"}s / ${lang()==="cs"?"P":"R"} ${s.rightSeconds||"–"}s`;
   return "";
 }).join(" / ");
}

function setRows(day,inst,m,e){

   <input inputmode="decimal" placeholder="${t("speed")}" value="${esc(e.speed)}" oninput="updateEntry('${day}','${inst.instanceId}','speed',this.value)">
  </div></div>`;
 }
 let out="";
 for(let i=0;i<m.sets;i++){
  const s=e.sets?.[i]||{};

  if(m.mode==="weight")inputs=`<div class="inputs"><input inputmode="decimal" placeholder="kg" value="${esc(s.kg)}" oninput="updateSet('${day}','${inst.instanceId}',${i},'kg',this.value)"><input inputmode="numeric" placeholder="${t("reps")}" value="${esc(s.reps)}" oninput="updateSet('${day}','${inst.instanceId}',${i},'reps',this.value)"></div>`;

  if(m.mode==="sideweight")inputs=`<div class="inputs three"><input inputmode="decimal" placeholder="kg" value="${esc(s.kg)}" oninput="updateSet('${day}','${inst.instanceId}',${i},'kg',this.value)"><input inputmode="numeric" placeholder="${t("left")}" value="${esc(s.left)}" oninput="updateSet('${day}','${inst.instanceId}',${i},'left',this.value)"><input inputmode="numeric" placeholder="${t("right")}" value="${esc(s.right)}" oninput="updateSet('${day}','${inst.instanceId}',${i},'right',this.value)"></div>`;
  if(m.mode==="sidetime")inputs=`<div class="inputs"><input inputmode="numeric" placeholder="${t("left")} s" value="${esc(s.leftSeconds)}" oninput="updateSet('${day}','${inst.instanceId}',${i},'leftSeconds',this.value)"><input inputmode="numeric" placeholder="${t("right")} s" value="${esc(s.rightSeconds)}" oninput="updateSet('${day}','${inst.instanceId}',${i},'rightSeconds',this.value)"></div>`;
  out+=`<div class="setrow"><div class="sethead"><span>${t("set")} ${i+1}</span></div>${inputs}</div>`;
 }
 return out;
}

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return Math.abs(h)}
function recordSets(rec){if(rec.mode==="cardio")return 1;return nonemptySets(rec).length}
function recordVolume(rec){
 if(rec.mode==="cardio")return +(rec.minutes||0);
 return nonemptySets(rec).reduce((sum,s)=>{
  if(rec.mode==="weight")return sum+(+s.kg||0)*(+s.reps||0);
  if(rec.mode==="reps")return sum+(+s.reps||0);
  if(rec.mode==="time")return sum+(+s.seconds||0)/30;
  if(rec.mode==="sideweight")return sum+(+s.kg||0)*((+s.left||0)+(+s.right||0));
  if(rec.mode==="sidetime")return sum+((+s.leftSeconds||0)+(+s.rightSeconds||0))/60;
  return sum;
 },0);
}
function recentRecords(days=21){
 const cutoff=new Date();cutoff.setDate(cutoff.getDate()-days);const cut=cutoff.toISOString().slice(0,10),out=[];
 Object.entries(state.history).forEach(([id,arr])=>(arr||[]).forEach(r=>{if((r.date||"")>=cut)out.push({...r,exerciseId:id})}));
 return out;
}
function categoryStagnant(cat){
 const ids=LIBRARY.filter(x=>x.category===cat).map(x=>x.id);
 const recs=ids.flatMap(id=>(state.history[id]||[]).map(r=>({...r,id}))).sort((a,b)=>a.date.localeCompare(b.date)).slice(-3);
 if(recs.length<3)return false;
 const scores=recs.map(recordVolume);return scores[2]<=Math.max(scores[0],scores[1])*1.02;
}
function recommendExercise(day){
 const current=new Set(dayInstances(day).map(x=>metaFor(day,x).id));
 const recent=recentRecords(21),setsByCat={};recent.forEach(r=>{const x=EX[r.exerciseId];if(x)setsByCat[x.category]=(setsByCat[x.category]||0)+recordSets(r)});
 const desired={chest:6,back:8,shoulders:5,biceps:4,triceps:4,quads:6,hamstrings:6,calves:4,core:12};
 const prefs={monday:["biceps","triceps","calves","core"],wednesday:["triceps","biceps","calves","chest"],friday:["biceps","triceps","calves","shoulders","core"]}[day];
 const candidates=LIBRARY.filter(x=>x.category!=="cardio"&&!current.has(x.id));
 if(!candidates.length)return null;
 const date=today();let best=null;
 candidates.forEach(x=>{
  const catSets=setsByCat[x.category]||0,def=Math.max(0,(desired[x.category]||4)-catSets);
  const exact=recent.filter(r=>r.exerciseId===x.id),last=exact.sort((a,b)=>a.date.localeCompare(b.date)).at(-1);
  let freshness=8;if(last){const dd=(new Date(date)-new Date(last.date))/86400000;freshness=Math.min(8,Math.max(-8,dd-3))}
  const pi=prefs.indexOf(x.category),pref=pi>=0?6-pi:0;const rotate=hash(date+day+x.id)%9;
  const plateau=categoryStagnant(x.category)?(exact.length?0:5):0;
  const score=def*2.4+pref+freshness+rotate+plateau-(exact.length*2);
  if(!best||score>best.score)best={item:x,score,catSets,plateau:categoryStagnant(x.category),fresh:!last};
 });
 if(!best)return null;
 let reason;
 const anyHistory=Object.values(state.history).some(a=>a.length);
 if(!anyHistory)reason=t("noDataReason");
 else{
  const parts=[`${t("lowVolumeReason")} (${best.catSets}).`];
  if(best.plateau)parts.push(t("plateauReason"));else if(best.fresh)parts.push(t("freshReason"));
  reason=parts.join(" ");
 }
 return {...best,reason};
}

 let inputs="";
 const s=e.sets?.[idx]||{};
 if(m.mode==="weight")inputs=`<div class="live-inputs"><input id="liveKg" inputmode="decimal" placeholder="kg" value="${esc(s.kg)}"><input id="liveReps" inputmode="numeric" placeholder="${t("reps")}" value="${esc(s.reps)}"></div>`;
 if(m.mode==="reps")inputs=`<div class="live-inputs one"><input id="liveReps" inputmode="numeric" placeholder="${t("reps")}" value="${esc(s.reps)}"></div>`;
 if(m.mode==="time")inputs=`<div class="live-inputs one"><input id="liveSeconds" inputmode="numeric" placeholder="${t("seconds")}" value="${esc(s.seconds)}"></div>`;
 if(m.mode==="sideweight")inputs=`<div class="live-inputs three"><input id="liveKg" inputmode="decimal" placeholder="kg" value="${esc(s.kg)}"><input id="liveLeft" inputmode="numeric" placeholder="${t("left")}" value="${esc(s.left)}"><input id="liveRight" inputmode="numeric" placeholder="${t("right")}" value="${esc(s.right)}"></div>`;
 if(m.mode==="sidetime")inputs=`<div class="live-inputs"><input id="liveLeftSeconds" inputmode="numeric" placeholder="${t("left")} s" value="${esc(s.leftSeconds)}"><input id="liveRightSeconds" inputmode="numeric" placeholder="${t("right")} s" value="${esc(s.rightSeconds)}"></div>`;
 if(m.mode==="cardio")inputs=`<div class="live-inputs"><input id="liveMinutes" inputmode="numeric" placeholder="${t("minutes")}" value="${esc(e.minutes)}"><input id="liveSpeed" inputmode="decimal" placeholder="${t("speed")}" value="${esc(e.speed)}"></div>`;
 liveContent.innerHTML=`<div class="kicker">${BASE_PLANS[day]["title_"+lang()]}</div><h2>${esc(itemName(m))}</h2><div class="live-target">${targetText(m)}</div>${last?`<div class="live-last">${t("previous")}: <strong>${esc(formatRecord(last))}</strong></div>`:""}
 <button class="video-btn" onclick="openVideo('${m.id}')">▶ ${t("video")}</button>
 <div class="live-set"><h3>${m.mode==="cardio"?"Kardio":`${t("set")} ${idx+1} / ${m.sets}`}</h3>${inputs}<button class="live-done" onclick="completeLiveSet('${inst.instanceId}',${idx})">${m.mode==="cardio"?t("saveCardio"):t("doneRest")}</button></div>
 <input class="note" placeholder="${t("note")}" value="${esc(e.notes)}" oninput="updateEntry('${day}','${inst.instanceId}','notes',this.value)">
 <details><summary>${t("technique")} ▾</summary><div class="live-tech"><b>${t("tips")}:</b><ul>${m.tips[lang()].map(v=>`<li>${esc(v)}</li>`).join("")}</ul><b>${t("avoid")}:</b><ul>${m.mistakes[lang()].map(v=>`<li>${esc(v)}</li>`).join("")}</ul></div></details>`;
 updateWorkoutTimes();
}
function completeLiveSet(instanceId,index){
 const day=state.activeWorkout.day,inst=activeInstances().find(x=>x.instanceId===instanceId),m=metaFor(day,inst),e=entry(day,instanceId),s={};
 if(m.mode==="weight"){s.kg=liveKg.value.trim();s.reps=liveReps.value.trim();if(!s.kg||!s.reps)return alert(t("enterBoth"))}
 if(m.mode==="reps"){s.reps=liveReps.value.trim();if(!s.reps)return alert(t("enterReps"))}
 if(m.mode==="time"){s.seconds=liveSeconds.value.trim();if(!s.seconds)return alert(t("enterSeconds"))}
 if(m.mode==="sideweight"){s.kg=liveKg.value.trim();s.left=liveLeft.value.trim();s.right=liveRight.value.trim();if(!s.kg||!s.left||!s.right)return alert(t("enterSides"))}
 if(m.mode==="sidetime"){s.leftSeconds=liveLeftSeconds.value.trim();s.rightSeconds=liveRightSeconds.value.trim();if(!s.leftSeconds||!s.rightSeconds)return alert(t("enterSides"))}
 if(m.mode==="cardio"){
  e.minutes=liveMinutes.value.trim();e.speed=liveSpeed.value.trim();if(!e.minutes&&!e.speed)return alert(t("enterCardio"));e.done=true;advanceAfterExercise();saveState();renderLive();return;
 }
 e.sets=e.sets||[];e.sets[index]=s;
 const complete=e.sets.slice(0,m.sets).filter(x=>hasSetData(m.mode,x)).length>=m.sets;
 if(complete){e.done=true;advanceAfterExercise()}
 saveState();renderLive();startRest(m.rest,itemName(m),index+1);
}
function advanceAfterExercise(){const arr=activeInstances(),w=state.activeWorkout;if(w.position<arr.length-1)w.position++}
function previousLive(){if(!state.activeWorkout)return;state.activeWorkout.position=Math.max(0,state.activeWorkout.position-1);saveState();renderLive()}
function nextLive(){if(!state.activeWorkout)return;state.activeWorkout.position=Math.min(activeInstances().length-1,state.activeWorkout.position+1);saveState();renderLive()}
function startRest(seconds,name,setNo){
 if(!seconds)return;state.activeWorkout.restEndAt=Date.now()+seconds*1000;state.activeWorkout.restExercise=`${name} • ${t("set")} ${setNo}`;saveState(false);
 liveOverlay.classList.remove("show");restOverlay.classList.add("show");restExercise.textContent=state.activeWorkout.restExercise;updateRest();clearInterval(restTick);restTick=setInterval(updateRest,500);
}
function updateRest(){
 const w=state.activeWorkout;if(!w)return;const left=Math.max(0,w.restEndAt-Date.now());restTime.textContent=fmt(left);
 if(left<=0){clearInterval(restTick);navigator.vibrate?.([220,100,220]);w.restEndAt=0;saveState(false)}
}
function returnFromRest(){restOverlay.classList.remove("show");liveOverlay.classList.add("show");renderLive()}
function skipRest(){if(state.activeWorkout)state.activeWorkout.restEndAt=0;clearInterval(restTick);saveState(false);returnFromRest()}
function askFinishWorkout(){if(state.activeWorkout&&confirm(t("finishConfirm")))openFinishDialog()}
function openFinishDialog(){
 const w=state.activeWorkout,day=w.day,instances=activeInstances(),done=instances.filter(x=>entry(day,x.instanceId).done).length,minutes=Math.max(1,Math.round(elapsedMs()/60000));
 liveOverlay.classList.remove("show");restOverlay.classList.remove("show");workoutRunning.classList.remove("show");
 finishSummary.innerHTML=`<p><b>${BASE_PLANS[day]["title_"+lang()]}</b></p><p>${t("time")}: <b>${minutes} min</b><br>${t("completed")}: <b>${done}/${instances.length}</b></p>`;
 finishDialog.dataset.minutes=minutes;finishDialog.showModal();document.exitFullscreen?.().catch(()=>{});
}
function cancelFinish(){
 finishDialog.close();
 if(state.activeWorkout){workoutRunning.classList.add("show");runningDay.textContent=BASE_PLANS[state.activeWorkout.day]["title_"+lang()].replace(/ –.*/,"");startWorkoutTicker()}
}
function saveFinishedWorkout(){
 const w=state.activeWorkout;if(!w)return;const day=w.day,d=state.days[day],instances=activeInstances();
 instances.forEach(inst=>{
  const e=entry(day,inst.instanceId),m=metaFor(day,inst);let rec={date:d.date||today(),day,exerciseId:m.id,mode:m.mode,notes:e.notes||""};
  if(m.mode==="cardio"){if(!e.minutes&&!e.speed)return;rec.minutes=e.minutes||"";rec.speed=e.speed||""}
  else{rec.sets=(e.sets||[]).slice(0,m.sets).filter(s=>hasSetData(m.mode,s));if(!rec.sets.length)return}
  state.history[m.id]=state.history[m.id]||[];state.history[m.id].push(rec);
 });
 const minutes=+finishDialog.dataset.minutes||1;state.workouts.push({date:d.date||today(),day,minutes,note:finishNote.value||""});
 if(day==="monday"&&(d.weight||d.waist))upsertProgress(d.date||today(),d.weight,d.waist);
 d.completed=true;state.activeWorkout=null;finishDialog.close();finishNote.value="";clearInterval(workoutTick);clearInterval(restTick);saveState();renderDay(day);renderProgress();alert(t("workoutDone"));
}
function restoreActiveWorkout(){
 if(!state.activeWorkout)return;workoutRunning.classList.add("show");runningDay.textContent=BASE_PLANS[state.activeWorkout.day]["title_"+lang()].replace(/ –.*/,"");startWorkoutTicker();
 if(state.activeWorkout.restEndAt>Date.now()){restExercise.textContent=state.activeWorkout.restExercise;restOverlay.classList.add("show");updateRest();clearInterval(restTick);restTick=setInterval(updateRest,500)}
 else if(state.activeWorkout.restEndAt){state.activeWorkout.restEndAt=0;saveState(false)}
}

function upsertProgress(date,weight,waist){
 const x=state.progress.find(p=>p.date===date);if(x){if(weight)x.weight=weight;if(waist)x.waist=waist}else state.progress.push({date,weight:weight||"",waist:waist||""});
 state.progress.sort((a,b)=>a.date.localeCompare(b.date));
}
function saveMeasurement(){
 const date=progressDate.value,weight=progressWeight.value.trim(),waist=progressWaist.value.trim();if(!weight&&!waist)return;
 upsertProgress(date,weight,waist);saveState();renderProgress();
}
function renderProgress(){
 const arr=[...state.progress].sort((a,b)=>a.date.localeCompare(b.date)),last=arr.at(-1)||{};
 document.getElementById("progress").innerHTML=`<div class="card"><div class="day-head"><div><h2>${t("progressTitle")}</h2><p>${t("measurement")}</p></div></div>
 <div class="progress-grid"><label><span>${t("date")}</span><input id="progressDate" type="date" value="${today()}"></label><label><span>${t("weight")}</span><input id="progressWeight" inputmode="decimal"></label><label><span>${t("waist")}</span><input id="progressWaist" inputmode="decimal"></label></div>
 <div class="actions"><button class="primary" onclick="saveMeasurement()">${t("saveMeasurement")}</button><button class="secondary" onclick="exportBackup()">${t("export")}</button><button class="secondary" onclick="importInput.click()">${t("import")}</button></div></div>
 <div class="stat-grid"><div class="stat"><span>${t("latestWeight")}</span><strong>${last.weight?esc(last.weight)+" kg":"–"}</strong></div><div class="stat"><span>${t("latestWaist")}</span><strong>${last.waist?esc(last.waist)+" cm":"–"}</strong></div><div class="stat"><span>${t("workouts")}</span><strong>${state.workouts.length}</strong></div></div>
 <div class="card"><h3>${t("weightChart")}</h3><canvas id="weightCanvas" width="700" height="220"></canvas></div>
 <div class="card"><h3>${t("waistChart")}</h3><canvas id="waistCanvas" width="700" height="220"></canvas></div>
 <div class="card"><h3>${t("measurements")}</h3>${arr.length?arr.slice().reverse().map((x,i)=>`<div class="history-card"><strong>${esc(x.date)}</strong><p>${x.weight?esc(x.weight)+" kg":""}${x.weight&&x.waist?" • ":""}${x.waist?esc(x.waist)+" cm":""}</p><button class="danger" onclick="deleteProgress('${x.date}')">${t("deleteMeasurement")}</button></div>`).join(""):`<div class="empty">${t("noHistory")}</div>`}</div>`;
 setTimeout(()=>{drawChart("weightCanvas","weight");drawChart("waistCanvas","waist")},0);
}
function drawChart(id,key){
 const c=document.getElementById(id);if(!c)return;const ctx=c.getContext("2d"),data=state.progress.filter(x=>+x[key]);ctx.clearRect(0,0,c.width,c.height);
 ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue("--line");ctx.lineWidth=1;for(let i=1;i<5;i++){const y=i*c.height/5;ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(c.width-15,y);ctx.stroke()}
 if(data.length<2){ctx.fillStyle=getComputedStyle(document.body).getPropertyValue("--muted");ctx.font="14px sans-serif";ctx.fillText(t("noHistory"),30,40);return}
 const vals=data.map(x=>+x[key]),min=Math.min(...vals),max=Math.max(...vals),span=Math.max(1,max-min);
 ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue("--primary");ctx.lineWidth=4;ctx.beginPath();
 data.forEach((x,i)=>{const px=30+i*(c.width-50)/(data.length-1),py=20+(max-+x[key])*(c.height-45)/span;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();
}
function deleteProgress(date){state.progress=state.progress.filter(x=>x.date!==date);saveState();renderProgress()}
function exportBackup(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.download=`gym-tracker-${today()}.json`;a.click();URL.revokeObjectURL(a.href)}
async function importBackup(file){if(!file)return;try{state=migrateState(JSON.parse(await file.text()));saveState();location.reload()}catch{alert("Invalid backup")}}

function scheduleCloud(){if(!cloudUser||!supabaseClient||cloudLoading)return;clearTimeout(cloudTimer);cloudStatus.textContent=t("cloudSaving");cloudStatus.className="cloud-sync";cloudTimer=setTimeout(saveCloud,1100)}
async function saveCloud(){
 if(!cloudUser||!supabaseClient)return;try{const {error}=await supabaseClient.from("gym_app_state").upsert({user_id:cloudUser.id,data:state,updated_at:new Date().toISOString()},{onConflict:"user_id"});if(error)throw error;cloudStatus.textContent=t("cloudSaved");cloudStatus.className="cloud-ok"}catch(e){console.error(e);cloudStatus.textContent=t("cloudError");cloudStatus.className="cloud-error"}
}
async function loadCloud(force=false){
 if(!cloudUser||!supabaseClient)return;cloudLoading=true;
 try{const {data,error}=await supabaseClient.from("gym_app_state").select("data,updated_at").eq("user_id",cloudUser.id).maybeSingle();if(error)throw error;
  if(data?.data&&(force||confirm(lang()==="cs"?"Načíst data z cloudu a nahradit data v tomto zařízení?":"Load cloud data and replace data on this device?"))){state=migrateState(data.data);localStorage.setItem(KEY,JSON.stringify(state));location.reload()}
  else if(!data)await saveCloud();
 }catch(e){console.error(e);cloudStatus.textContent=t("cloudError");cloudStatus.className="cloud-error"}finally{cloudLoading=false}
}
async function initCloud(){
 if(!supabaseClient){cloudStatus.textContent=t("cloudSignedOut");return}
 const {data:{session}}=await supabaseClient.auth.getSession();cloudUser=session?.user||null;updateCloudUI();
 supabaseClient.auth.onAuthStateChange((_event,session)=>{cloudUser=session?.user||null;updateCloudUI()});
 window.addEventListener("online",()=>{if(cloudUser)saveCloud()});
}
function updateCloudUI(){
 if(cloudUser){cloudStatus.textContent=t("cloudConnected");cloudStatus.className="cloud-ok";cloudLoggedOut.style.display="none";cloudLoggedIn.style.display="block";cloudUserEmail.textContent=cloudUser.email||""}
 else{cloudStatus.textContent=t("cloudSignedOut");cloudStatus.className="";cloudLoggedOut.style.display="block";cloudLoggedIn.style.display="none"}
}
function openCloud(){updateCloudUI();cloudDialog.showModal()}
async function cloudSignUp(){const email=cloudEmail.value.trim(),password=cloudPassword.value;if(!email||password.length<6)return alert("Email / password");const {data,error}=await supabaseClient.auth.signUp({email,password});if(error)return alert(error.message);cloudUser=data.user;updateCloudUI();if(data.session)await saveCloud();alert(t("accountCreated"))}
async function cloudSignIn(){const email=cloudEmail.value.trim(),password=cloudPassword.value;if(!email||!password)return;const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)return alert(error.message);cloudUser=data.user;updateCloudUI();cloudDialog.close();const meaningful=state.workouts.length||state.progress.length||Object.values(state.history).some(a=>a.length);if(meaningful){if(confirm(lang()==="cs"?"Uložit nejdřív data z tohoto zařízení do cloudu?":"Save this device's data to the cloud first?"))await saveCloud();else await loadCloud(true)}else await loadCloud(true)}
async function cloudSignOut(){await supabaseClient.auth.signOut();cloudUser=null;updateCloudUI();cloudDialog.close()}
async function syncNow(){await saveCloud();alert(t("syncDone"))}

function init(){
 applyTheme();applyLanguage();restoreActiveWorkout();initCloud();
 if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
 document.addEventListener("visibilitychange",()=>{if(!document.hidden){updateWorkoutTimes();if(state.activeWorkout?.restEndAt)updateRest()}});
}
init();
</script>
</body>
</html>
